yarnPath: .yarn/releases/yarn-4.1.1.cjs
nodeLinker: node-modules

# Individual advisories ignored by `yarn npm audit`, by advisory ID.
#
# Keep this list minimal and justify every entry. An entry here only silences the local
# and CI audit — the matching alert must also be dismissed on GitHub (Security ->
# Dependabot alerts) with the same reasoning, otherwise the two views disagree.
npmAuditIgnoreAdvisories:
  # playwright, GHSA-7mvr-c777-76hp. Browsers are downloaded without verifying the SSL
  # certificate; fixed in 1.55.1.
  #
  # @playwright/test is deliberately pinned to 1.55.0, because 1.55.1 also bumps the bundled
  # Chromium from build 1187 to 1193, and the 211 committed screenshots are compared with
  # threshold: 0 — a different browser build invalidates all of them. Upgrading therefore
  # belongs in its own pull request, where regenerating the baselines via /approve-snapshots
  # is the expected, reviewable outcome rather than noise inside an unrelated change.
  #
  # Scope of the risk: development only, at install time, over HTTPS to Microsoft's CDN. It
  # does not reach the published packages.
  #
  # Remove this entry together with that upgrade.
  - '1109208'

  # brace-expansion, GHSA-mh99-v99m-4gvg.
  # Upstream patched only the 5.x line, but the advisory range (<=5.0.7) is flat across
  # majors, so the already-patched 1.1.18 and 2.1.4 releases are still reported.
  # Forcing 5.x is not an option: its CommonJS build exports an object rather than a
  # function, so minimatch@3 throws "expand is not a function" on any {a,b} pattern.
  # Remove this entry once minimatch@3 is no longer in the dependency tree.
  - '1124334'
