yarnPath: .yarn/releases/yarn-4.18.1.cjs
nodeLinker: node-modules

# Individual advisories ignored by `yarn npm audit`, by advisory ID.
#
# Keep this list minimal and justify every entry. An entry here only silences the local
# and CI audit — the matching alert must also be dismissed on GitHub (Security ->
# Dependabot alerts) with the same reasoning, otherwise the two views disagree.
npmAuditIgnoreAdvisories:
  # braces, GHSA-vfj7-8cjw-p6xm.
  # Stack exhaustion on deeply nested patterns. No patched release: the advisory range is
  # <=3.0.3 and 3.0.3 is the latest version. braces comes only through micromatch@4 in build
  # and lint tooling (lint-staged, stylelint and its fast-glob, @parcel/watcher under sass),
  # where it expands glob patterns from the repository's own configuration, never from
  # untrusted input. GitHub auto-dismissed the alert.
  # Remove this entry once braces publishes a fix.
  - '1240992'
  # sprintf-js, GHSA-hp3w-g68c-fv3c.
  # Denial of service through a precision specifier in an attacker-controlled format string.
  # No patched release: the advisory range is <=1.1.3 and 1.1.3 is the latest version.
  # sprintf-js comes only through argparse@1, which formats its own usage and help strings, in
  # @rushstack/ts-command-line: the api-extractor CLI, which the repository does not run
  # (tools/api-extractor calls the library API).
  # Remove this entry once sprintf-js publishes a fix, or once argparse@1 leaves the tree.
  - '1241202'

# A version is installed only once it has been on the registry for a day: compromised releases are
# usually caught and unpublished within hours, so the delay keeps them out of the lockfile.
# Minutes rather than a duration string, because Dependabot reads the gate only as a plain number.
# The cooldown in .github/dependabot.yml has to stay at least as long: Dependabot picks a version
# without looking at this gate and would otherwise propose one that yarn refuses to install.
# An urgent fix that cannot wait a day goes in npmPreapprovedPackages as `<name>@<version>` until it
# is a day old. Not `YARN_NPM_MINIMAL_AGE_GATE=0`: that lifts the gate for the whole resolution,
# including whatever fresh transitive dependencies the fix pulls in.
npmMinimalAgeGate: 1440

# Our own packages are published by us and are taken without the delay.
npmPreapprovedPackages:
  - '@koobiq/*'

# Build scripts of dependencies stay disabled, as Yarn does by default since 4.14: an install
# script is how a compromised package usually runs its payload. A dependency that cannot work
# without its script is allowed by name through `dependenciesMeta.<name>.built` in package.json.
