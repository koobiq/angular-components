<div style="width: 200px" class="layout-column">
    <button kbq-button class="layout-margin-bottom-l" (click)="showSmall()">Small</button>

    <button kbq-button class="layout-margin-bottom-l" (click)="showMedium()">Medium</button>

    <button kbq-button (click)="showLarge()">Large</button>
</div>

<ng-template>
    <kbq-sidepanel-header [closeable]="true">{{ t().templateContent }}</kbq-sidepanel-header>
    <kbq-sidepanel-body
        style="--kbq-sidepanel-size-content-padding-top: 8px; --kbq-sidepanel-size-content-padding-bottom: 8px"
    >
        <div style="padding: 8px" class="kbq-subheading">{{ t().templateBody }}</div>

        @for (item of array; track $index) {
            <div style="padding: 8px">
                {{ $index + 1 }}
            </div>
        }
    </kbq-sidepanel-body>

    <kbq-sidepanel-footer>
        <kbq-sidepanel-actions align="left">
            <button cdkFocusInitial kbq-button [color]="'contrast'">
                <span>{{ t().button }}</span>
            </button>
        </kbq-sidepanel-actions>

        <kbq-sidepanel-actions align="right">
            <span>{{ t().action }}</span>
        </kbq-sidepanel-actions>
    </kbq-sidepanel-footer>
</ng-template>
