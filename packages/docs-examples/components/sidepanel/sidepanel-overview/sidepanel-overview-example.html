<div class="kbq-form-horizontal">
    <div class="kbq-form__row">
        <label class="kbq-form__label">{{ text().position }}</label>
        <kbq-form-field style="min-width: 120px" class="kbq-form__control flex-10">
            <kbq-select [(value)]="position">
                <kbq-option [value]="'right'">Right</kbq-option>
                <kbq-option [value]="'left'">Left</kbq-option>
                <kbq-option [value]="'top'">Top</kbq-option>
                <kbq-option [value]="'bottom'">Bottom</kbq-option>
            </kbq-select>
        </kbq-form-field>
    </div>
</div>

<br />

<button kbq-button [color]="'contrast'" (click)="openSidepanel()">
    <span>{{ text().open }}</span>
</button>

<ng-template>
    <kbq-sidepanel-header [closeable]="true">{{ text().templateContent }}</kbq-sidepanel-header>
    <kbq-sidepanel-body style="padding-top: 8px; padding-bottom: 8px">
        <div style="padding: 8px" class="kbq-subheading">{{ text().templateBody }}</div>

        @for (item of array; track $index) {
            <div style="padding: 8px">
                {{ $index + 1 }}
            </div>
        }
    </kbq-sidepanel-body>

    <kbq-sidepanel-footer>
        <kbq-sidepanel-actions align="left">
            <button cdkFocusInitial kbq-button [color]="'contrast'">
                <span>{{ text().button }}</span>
            </button>
        </kbq-sidepanel-actions>

        <kbq-sidepanel-actions align="right">
            <span>{{ text().action }}</span>
        </kbq-sidepanel-actions>
    </kbq-sidepanel-footer>
</ng-template>
