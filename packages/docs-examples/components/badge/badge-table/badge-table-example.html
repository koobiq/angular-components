<table kbq-table class="docs-table-example badge-table-example">
    <thead>
        <tr>
            <th style="width: 33.3%">Column 1</th>
            <th style="width: 33.3%">Column 2</th>
            <th style="width: 33.3%">Column 3</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>{{ t().value }}</td>
            <td>
                <kbq-badge [badgeColor]="colors.FadeContrast">{{ t().badge }}</kbq-badge>
            </td>
            <td>{{ t().phishingResource }}</td>
        </tr>
        <tr>
            <td>
                <a kbqLink href="https://koobiq.io/en/components/badge">{{ t().link }}</a>
                &nbsp;
                <kbq-badge [badgeColor]="colors.FadeContrast" [compact]="true">{{ t().badge }}</kbq-badge>
            </td>
            <td>
                {{ t().processListAttempt }}
            </td>
            <td>
                <kbq-badge [badgeColor]="colors.FadeSuccess" [outline]="true">{{ t().badge }}</kbq-badge>
            </td>
        </tr>
    </tbody>
</table>
