<table kbq-table class="docs-table-example badge-table-example">
    <thead>
        <tr>
            <th style="width: 33.3%">{{ text().column(1) }}</th>
            <th style="width: 33.3%">{{ text().column(2) }}</th>
            <th style="width: 33.3%">{{ text().column(3) }}</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>{{ text().value }}</td>
            <td>
                <kbq-badge [badgeColor]="colors.FadeContrast">{{ text().badge }}</kbq-badge>
            </td>
            <td>{{ text().phishingResource }}</td>
        </tr>
        <tr>
            <td>
                <a kbqLink href="https://koobiq.io/en/components/badge">{{ text().link }}</a>
                &nbsp;
                <kbq-badge [badgeColor]="colors.FadeContrast" [compact]="true">{{ text().badge }}</kbq-badge>
            </td>
            <td>
                {{ text().processListAttempt }}
            </td>
            <td>
                <kbq-badge [badgeColor]="colors.FadeSuccess" [outline]="true">{{ text().badge }}</kbq-badge>
            </td>
        </tr>
    </tbody>
</table>
