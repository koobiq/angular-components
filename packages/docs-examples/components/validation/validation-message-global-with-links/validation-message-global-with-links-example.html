<form novalidate class="kbq-form-vertical" [formGroup]="form" (input)="hideErrorOnceFilled()" (ngSubmit)="submitForm()">
    @if (showError()) {
        <kbq-alert
            alertColor="error"
            alertStyle="colored"
            class="example-alert layout-margin-bottom-l"
            [class.example-alert_in-progress]="inProgress()"
            [compact]="true"
        >
            <i kbq-icon="kbq-circle-info_16" [color]="'error'"></i>
            <span>
                Fill in at least one of the fields:
                <span kbqLink (click)="seriesInput.focus()">Series,</span>
                <span>&nbsp;</span>
                <span kbqLink (click)="numberInput.focus()">Number</span>
                or
                <span kbqLink (click)="lastNameInput.focus()">Last name</span>
            </span>
        </kbq-alert>
    }

    <div class="kbq-form__fieldset layout-margin-bottom-xxl">
        <div class="kbq-form__fieldset kbq-horizontal">
            <div class="kbq-form__row flex-25">
                <kbq-form-field class="kbq-form__control">
                    <kbq-label>Series</kbq-label>
                    <input
                        #seriesInput
                        #seriesTooltip="kbqTooltip"
                        formControlName="series"
                        kbqInput
                        name="input"
                        kbqTooltipColor="error"
                        [kbqEnterDelay]="10"
                        [kbqPlacement]="popUpPlacements.Top"
                        [kbqTooltip]="'Only numbers'"
                        [kbqTrigger]="'manual'"
                        (blur)="seriesTooltip.hide()"
                        (input)="onInput($event, seriesTooltip, form.controls.series)"
                    />
                </kbq-form-field>
            </div>

            <div class="kbq-form__row flex-40">
                <kbq-form-field class="kbq-form__control">
                    <kbq-label>Number</kbq-label>
                    <input
                        #numberInput
                        #numberTooltip="kbqTooltip"
                        formControlName="number"
                        kbqInput
                        name="input"
                        kbqTooltipColor="error"
                        [kbqEnterDelay]="10"
                        [kbqPlacement]="popUpPlacements.Top"
                        [kbqTooltip]="'Only numbers'"
                        [kbqTrigger]="'manual'"
                        (blur)="numberTooltip.hide()"
                        (input)="onInput($event, numberTooltip, form.controls.number)"
                    />
                </kbq-form-field>
            </div>
        </div>

        <div class="kbq-form__row">
            <kbq-form-field class="kbq-form__control">
                <kbq-label>Last name</kbq-label>
                <input #lastNameInput formControlName="lastName" kbqInput name="input" />
            </kbq-form-field>
        </div>

        <div class="kbq-form__row">
            <kbq-form-field class="kbq-form__control">
                <kbq-label>Name</kbq-label>
                <input formControlName="firstName" kbqInput name="input" />

                <kbq-hint>Optional</kbq-hint>
            </kbq-form-field>
        </div>

        <div class="kbq-form__row">
            <kbq-form-field class="kbq-form__control">
                <kbq-label>Patronymic</kbq-label>
                <input formControlName="patronymic" kbqInput name="input" />

                <kbq-hint>Optional</kbq-hint>
            </kbq-form-field>
        </div>
    </div>

    <div class="kbq-form__row layout-align-start-start">
        <button color="contrast" kbq-button type="submit" [class.kbq-progress]="inProgress()" [disabled]="inProgress()">
            Submit
        </button>
    </div>
</form>
