<div class="layout-margin-bottom-m">
    <kbq-button-toggle-group #group1="kbqButtonToggleGroup">
        <kbq-button-toggle [checked]="true" [value]="1">
            <i kbq-icon="kbq-briefcase_16"></i>
            {{ t().courier }}
        </kbq-button-toggle>
        <kbq-button-toggle [value]="2">
            <i kbq-icon="kbq-briefcase_16"></i>
            {{ t().donkeyExpress }}
        </kbq-button-toggle>
        <kbq-button-toggle [value]="3">
            <i kbq-icon="kbq-briefcase_16"></i>
            {{ t().middleEarthPost }}
        </kbq-button-toggle>
    </kbq-button-toggle-group>
</div>

<div class="layout-margin-bottom-m">
    <kbq-button-toggle-group #group2="kbqButtonToggleGroup">
        <kbq-button-toggle [checked]="true" [value]="1">{{ t().courier }}</kbq-button-toggle>
        <kbq-button-toggle [value]="2">{{ t().donkeyExpress }}</kbq-button-toggle>
        <kbq-button-toggle [value]="3">{{ t().middleEarthPost }}</kbq-button-toggle>
    </kbq-button-toggle-group>
</div>

<div>
    <!-- an icon carries no accessible name, so an icon-only toggle needs one of its own -->
    <kbq-button-toggle-group #group3="kbqButtonToggleGroup" [aria-label]="t().deliveryMethod">
        <kbq-button-toggle [aria-label]="t().courier" [checked]="true" [value]="1">
            <i kbq-icon="kbq-briefcase_16"></i>
        </kbq-button-toggle>
        <kbq-button-toggle [aria-label]="t().donkeyExpress" [value]="2">
            <i kbq-icon="kbq-briefcase_16"></i>
        </kbq-button-toggle>
        <kbq-button-toggle [aria-label]="t().middleEarthPost" [value]="3">
            <i kbq-icon="kbq-briefcase_16"></i>
        </kbq-button-toggle>
    </kbq-button-toggle-group>
</div>
