<div class="layout-margin-bottom-m">
    <kbq-button-toggle-group #group1="kbqButtonToggleGroup">
        <kbq-button-toggle [checked]="true" [value]="1">
            <i kbq-icon="kbq-briefcase_16"></i>
            {{ text().courier }}
        </kbq-button-toggle>
        <kbq-button-toggle [value]="2">
            <i kbq-icon="kbq-briefcase_16"></i>
            {{ text().donkeyExpress }}
        </kbq-button-toggle>
        <kbq-button-toggle [value]="3">
            <i kbq-icon="kbq-briefcase_16"></i>
            {{ text().middleEarthPost }}
        </kbq-button-toggle>
    </kbq-button-toggle-group>
</div>

<div class="layout-margin-bottom-m">
    <kbq-button-toggle-group #group2="kbqButtonToggleGroup">
        <kbq-button-toggle [checked]="true" [value]="1">{{ text().courier }}</kbq-button-toggle>
        <kbq-button-toggle [value]="2">{{ text().donkeyExpress }}</kbq-button-toggle>
        <kbq-button-toggle [value]="3">{{ text().middleEarthPost }}</kbq-button-toggle>
    </kbq-button-toggle-group>
</div>

<div>
    <!-- an icon carries no accessible name, so an icon-only toggle needs one of its own -->
    <kbq-button-toggle-group #group3="kbqButtonToggleGroup" [aria-label]="text().deliveryMethod">
        <kbq-button-toggle [aria-label]="text().courier" [checked]="true" [value]="1">
            <i kbq-icon="kbq-briefcase_16"></i>
        </kbq-button-toggle>
        <kbq-button-toggle [aria-label]="text().donkeyExpress" [value]="2">
            <i kbq-icon="kbq-briefcase_16"></i>
        </kbq-button-toggle>
        <kbq-button-toggle [aria-label]="text().middleEarthPost" [value]="3">
            <i kbq-icon="kbq-briefcase_16"></i>
        </kbq-button-toggle>
    </kbq-button-toggle-group>
</div>
