<div class="layout-margin-bottom-m">
    <kbq-button-toggle-group #group1="kbqButtonToggleGroup">
        <kbq-button-toggle [checked]="true" [value]="1">
            <i kbq-icon="kbq-briefcase_16"></i>
            Курьером
        </kbq-button-toggle>
        <kbq-button-toggle [value]="2">
            <i kbq-icon="kbq-briefcase_16"></i>
            Ослик Экспресс
        </kbq-button-toggle>
        <kbq-button-toggle [value]="3">
            <i kbq-icon="kbq-briefcase_16"></i>
            Почтой Средиземья
        </kbq-button-toggle>
    </kbq-button-toggle-group>
</div>

<div class="layout-margin-bottom-m">
    <kbq-button-toggle-group #group2="kbqButtonToggleGroup">
        <kbq-button-toggle [checked]="true" [value]="1">Курьером</kbq-button-toggle>
        <kbq-button-toggle [value]="2">Ослик Экспресс</kbq-button-toggle>
        <kbq-button-toggle [value]="3">Почтой Средиземья</kbq-button-toggle>
    </kbq-button-toggle-group>
</div>

<div>
    <!-- an icon carries no accessible name, so an icon-only toggle needs one of its own -->
    <kbq-button-toggle-group #group3="kbqButtonToggleGroup" aria-label="Способ доставки">
        <kbq-button-toggle aria-label="Курьером" [checked]="true" [value]="1">
            <i kbq-icon="kbq-briefcase_16"></i>
        </kbq-button-toggle>
        <kbq-button-toggle aria-label="Ослик Экспресс" [value]="2">
            <i kbq-icon="kbq-briefcase_16"></i>
        </kbq-button-toggle>
        <kbq-button-toggle aria-label="Почтой Средиземья" [value]="3">
            <i kbq-icon="kbq-briefcase_16"></i>
        </kbq-button-toggle>
    </kbq-button-toggle-group>
</div>
