<div class="example-fill-and-style__button-group">
    <div class="example-button">
        <div class="example-label kbq-text-compact">Filled Contrast</div>
        <button kbq-button [color]="colors.Contrast">{{ t().button }}</button>
    </div>
    <div class="example-button">
        <div class="example-label kbq-text-compact">Filled Fade Contrast</div>
        <button kbq-button>{{ t().button }}</button>
    </div>
    <div class="example-button">
        <div class="example-label kbq-text-compact">Outline Fade Theme</div>
        <button kbq-button [color]="colors.ThemeFade" [kbqStyle]="styles.Outline">{{ t().button }}</button>
    </div>
    <div class="example-button">
        <div class="example-label kbq-text-compact">Outline Fade Contrast</div>
        <button kbq-button [color]="colors.ContrastFade" [kbqStyle]="styles.Outline">{{ t().button }}</button>
    </div>
    <div class="example-button">
        <div class="example-label kbq-text-compact">Transparent Theme</div>
        <button kbq-button [color]="colors.Theme" [kbqStyle]="styles.Transparent">{{ t().button }}</button>
    </div>
    <div class="example-button">
        <div class="example-label kbq-text-compact">Transparent Contrast</div>
        <button kbq-button [color]="colors.Contrast" [kbqStyle]="styles.Transparent">{{ t().button }}</button>
    </div>
</div>
