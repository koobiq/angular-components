<div class="layout-column">
    <kbq-checkbox class="layout-margin-bottom-m" [(checked)]="checked">
        {{ t().default }}
        <kbq-hint>{{ checked() ? t().checked : t().unchecked }}</kbq-hint>
    </kbq-checkbox>
    <kbq-checkbox big [(checked)]="bigChecked">
        {{ t().big }}
        <kbq-hint>{{ bigChecked() ? t().checked : t().unchecked }}</kbq-hint>
    </kbq-checkbox>
</div>
