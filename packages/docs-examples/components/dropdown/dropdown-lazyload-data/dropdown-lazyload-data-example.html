<kbq-form-field class="layout-margin-bottom-l">
    <input autocomplete="off" kbqInput style="max-width: 200px" type="text" [(ngModel)]="someValue" />
</kbq-form-field>

<button kbq-button [kbqDropdownTriggerData]="{ someValue: someValue }" [kbqDropdownTriggerFor]="appDropdownLazy">
    dropdown lazy
    <i kbq-icon="kbq-chevron-down-s_16"></i>
</button>

<kbq-dropdown #appDropdownLazy="kbqDropdown">
    <ng-template let-someValue="someValue" kbqDropdownContent>
        <button kbq-dropdown-item>{{ text().dropdownTrigger }}</button>
        <button kbq-dropdown-item>
            Point 1
            <span kbqDropdownItemCaption>{{ text().someInfo }}</span>
        </button>
        <button kbq-dropdown-item>{{ text().value }} {{ someValue }}</button>
    </ng-template>
</kbq-dropdown>
