<button kbq-button [kbqDropdownTriggerFor]="appDropdownWithNested">
    dropdown
    <i kbq-icon="kbq-chevron-down-s_16"></i>
</button>

<kbq-dropdown #appDropdownWithNested="kbqDropdown">
    <button kbq-dropdown-item>{{ text().searchSettings }}</button>

    <button kbq-dropdown-item [kbqDropdownTriggerFor]="appDropdownNested">Text</button>
    <button kbq-dropdown-item [kbqDropdownTriggerFor]="appDropdownNested">{{ text().paragraphStyles }}</button>
    <button kbq-dropdown-item [kbqDropdownTriggerFor]="appDropdownNested">{{ text().alignIntent }}</button>
    <button kbq-dropdown-item [kbqDropdownTriggerFor]="appDropdownNested">{{ text().lineSpacing }}</button>
    <button kbq-dropdown-item [disabled]="true" [kbqDropdownTriggerFor]="appDropdownNested">
        {{ text().columns }}
    </button>
    <button kbq-dropdown-item [kbqDropdownTriggerFor]="appDropdownNested">{{ text().bulletsNumbering }}</button>

    <kbq-divider />

    <button kbq-dropdown-item [kbqDropdownTriggerFor]="appDropdownNested">{{ text().headersFooters }}</button>
    <button kbq-dropdown-item [kbqDropdownTriggerFor]="appDropdownNested">{{ text().pageNumbers }}</button>

    <kbq-divider />

    <button kbq-dropdown-item [kbqDropdownTriggerFor]="appDropdownNested">{{ text().table }}</button>

    <kbq-divider />

    <button kbq-dropdown-item [kbqDropdownTriggerFor]="appDropdownNested">{{ text().image }}</button>

    <kbq-divider />

    <button kbq-dropdown-item [kbqDropdownTriggerFor]="appDropdownNested">{{ text().clearFormatting }}</button>

    <kbq-divider />

    <button kbq-dropdown-item [kbqDropdownTriggerFor]="appDropdownNested">{{ text().borderLines }}</button>
</kbq-dropdown>

<kbq-dropdown #appDropdownNested="kbqDropdown">
    <button kbq-dropdown-item>{{ text().borderAndShading }}</button>

    <kbq-divider />

    <button kbq-dropdown-item [kbqDropdownTriggerFor]="appDropdownNestedNested">{{ text().normalText }}</button>
    <button kbq-dropdown-item [kbqDropdownTriggerFor]="appDropdownNestedNested">{{ text().title }}</button>
    <button kbq-dropdown-item [kbqDropdownTriggerFor]="appDropdownNestedNested">{{ text().subtitle }}</button>
    <button kbq-dropdown-item [kbqDropdownTriggerFor]="appDropdownNestedNested">Heading 1</button>
    <button kbq-dropdown-item [kbqDropdownTriggerFor]="appDropdownNestedNested">Heading 2</button>
    <button kbq-dropdown-item [kbqDropdownTriggerFor]="appDropdownNestedNested">Heading 3</button>
    <button kbq-dropdown-item [kbqDropdownTriggerFor]="appDropdownNestedNested">Heading 4</button>
    <button kbq-dropdown-item [kbqDropdownTriggerFor]="appDropdownNestedNested">Heading 5</button>
    <button kbq-dropdown-item [kbqDropdownTriggerFor]="appDropdownNestedNested">Heading 6</button>

    <kbq-divider />

    <button kbq-dropdown-item [kbqDropdownTriggerFor]="appDropdownNestedNested">{{ text().options }}</button>
</kbq-dropdown>

<kbq-dropdown #appDropdownNestedNested="kbqDropdown">
    <button kbq-dropdown-item>{{ text().applyTitle(text().title) }}</button>
    <button kbq-dropdown-item>{{ text().updateTitle(text().title) }}</button>
</kbq-dropdown>
