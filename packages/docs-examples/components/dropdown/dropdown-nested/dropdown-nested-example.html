<button kbq-button [kbqDropdownTriggerFor]="appDropdownWithNested">
    dropdown
    <i kbq-icon="kbq-chevron-down-s_16"></i>
</button>

<kbq-dropdown #appDropdownWithNested="kbqDropdown">
    <button kbq-dropdown-item>{{ t().searchSettings }}</button>

    <button kbq-dropdown-item [kbqDropdownTriggerFor]="appDropdownNested">Text</button>
    <button kbq-dropdown-item [kbqDropdownTriggerFor]="appDropdownNested">{{ t().paragraphStyles }}</button>
    <button kbq-dropdown-item [kbqDropdownTriggerFor]="appDropdownNested">{{ t().alignIntent }}</button>
    <button kbq-dropdown-item [kbqDropdownTriggerFor]="appDropdownNested">{{ t().lineSpacing }}</button>
    <button kbq-dropdown-item [disabled]="true" [kbqDropdownTriggerFor]="appDropdownNested">
        {{ t().columns }}
    </button>
    <button kbq-dropdown-item [kbqDropdownTriggerFor]="appDropdownNested">{{ t().bulletsNumbering }}</button>

    <kbq-divider />

    <button kbq-dropdown-item [kbqDropdownTriggerFor]="appDropdownNested">{{ t().headersFooters }}</button>
    <button kbq-dropdown-item [kbqDropdownTriggerFor]="appDropdownNested">{{ t().pageNumbers }}</button>

    <kbq-divider />

    <button kbq-dropdown-item [kbqDropdownTriggerFor]="appDropdownNested">{{ t().table }}</button>

    <kbq-divider />

    <button kbq-dropdown-item [kbqDropdownTriggerFor]="appDropdownNested">{{ t().image }}</button>

    <kbq-divider />

    <button kbq-dropdown-item [kbqDropdownTriggerFor]="appDropdownNested">{{ t().clearFormatting }}</button>

    <kbq-divider />

    <button kbq-dropdown-item [kbqDropdownTriggerFor]="appDropdownNested">{{ t().borderLines }}</button>
</kbq-dropdown>

<kbq-dropdown #appDropdownNested="kbqDropdown">
    <button kbq-dropdown-item>{{ t().borderAndShading }}</button>

    <kbq-divider />

    <button kbq-dropdown-item [kbqDropdownTriggerFor]="appDropdownNestedNested">{{ t().normalText }}</button>
    <button kbq-dropdown-item [kbqDropdownTriggerFor]="appDropdownNestedNested">{{ t().title }}</button>
    <button kbq-dropdown-item [kbqDropdownTriggerFor]="appDropdownNestedNested">{{ t().subtitle }}</button>
    <button kbq-dropdown-item [kbqDropdownTriggerFor]="appDropdownNestedNested">Heading 1</button>
    <button kbq-dropdown-item [kbqDropdownTriggerFor]="appDropdownNestedNested">Heading 2</button>
    <button kbq-dropdown-item [kbqDropdownTriggerFor]="appDropdownNestedNested">Heading 3</button>
    <button kbq-dropdown-item [kbqDropdownTriggerFor]="appDropdownNestedNested">Heading 4</button>
    <button kbq-dropdown-item [kbqDropdownTriggerFor]="appDropdownNestedNested">Heading 5</button>
    <button kbq-dropdown-item [kbqDropdownTriggerFor]="appDropdownNestedNested">Heading 6</button>

    <kbq-divider />

    <button kbq-dropdown-item [kbqDropdownTriggerFor]="appDropdownNestedNested">{{ t().options }}</button>
</kbq-dropdown>

<kbq-dropdown #appDropdownNestedNested="kbqDropdown">
    <button kbq-dropdown-item>{{ t().applyTitle(t().title) }}</button>
    <button kbq-dropdown-item>{{ t().updateTitle(t().title) }}</button>
</kbq-dropdown>
