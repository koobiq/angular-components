<kbq-checkbox class="layout-margin-right-l" [(ngModel)]="openByArrowDown">
    {{ t().toggleOpenByArrowDown }}
</kbq-checkbox>

<button kbq-button [kbqDropdownTriggerFor]="appDropdown" [openByArrowDown]="openByArrowDown">
    dropdown
    <i kbq-icon="kbq-chevron-down-s_16"></i>
</button>

<kbq-dropdown #appDropdown="kbqDropdown" [panelMaxWidth]="200">
    <button kbq-dropdown-item>{{ t().textNormal }}</button>

    <button kbq-dropdown-item>
        <i kbq-icon="kbq-circle-info_16" [color]="'contrast'"></i>
        Text Normal
    </button>

    <button kbq-dropdown-item>
        Text Normal
        <div kbqDropdownItemCaption>{{ t().caption }}</div>
    </button>

    <button kbq-dropdown-item>
        <i kbq-icon="kbq-circle-info_16" [color]="'contrast'"></i>
        Text Normal
        <div kbqDropdownItemCaption>{{ t().caption }}</div>
    </button>

    <button kbq-dropdown-item>
        <i kbq-icon="kbq-circle-xs_16" [color]="'contrast'"></i>
        Text Normal
    </button>

    <button kbq-dropdown-item kbq-title>
        Text Normal and very long text Text Normal and very long text Text Normal and very long text Text Normal and
        very long text
    </button>

    <kbq-divider />

    <div kbqDropdownGroupHeader>{{ t().header }}</div>

    <button disabled kbq-dropdown-item>{{ t().disabled }}</button>

    <kbq-divider />

    <kbq-optgroup label="Subheading" />

    <button disabled kbq-dropdown-item>
        <i kbq-icon="kbq-circle-xs_16"></i>
        Disabled with icon
    </button>

    <kbq-divider />
    <button kbq-dropdown-item>{{ t().point2 }}</button>
</kbq-dropdown>
