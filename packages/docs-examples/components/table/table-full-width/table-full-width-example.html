<table kbq-table style="margin-bottom: 32px; width: 100%">
    <thead>
        <tr>
            <th style="min-width: 140px">{{ text().incident }}</th>
            <th>{{ text().description }}</th>
            <th>{{ text().type }}</th>
        </tr>
    </thead>
    <tbody>
        @for (row of rows(); track row.id) {
            <tr>
                <td>{{ row.id }}</td>
                <td>{{ row.description }}</td>
                <td>{{ row.type }}</td>
            </tr>
        }
    </tbody>
</table>
