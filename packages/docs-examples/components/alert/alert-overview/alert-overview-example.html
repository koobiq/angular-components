<div class="layout-row example-row layout-gap-l flex-100">
    <div class="layout-column example-column">
        <kbq-alert>
            <i aria-hidden="true" kbq-icon-item="kbq-circle-info_16"></i>
            <div kbq-alert-title>{{ t().heading }}</div>
            {{ t().body }}
            <button kbq-alert-control kbq-button [color]="'theme'" [kbqStyle]="'transparent'">
                {{ t().action }}
            </button>
            <button kbq-alert-control kbq-button [color]="'theme'" [kbqStyle]="'transparent'">
                {{ t().anotherAction }}
            </button>
        </kbq-alert>
    </div>
    <div class="layout-column example-column">
        <kbq-alert [compact]="true">
            <i aria-hidden="true" kbq-icon="kbq-circle-info_16"></i>
            <div kbq-alert-title>{{ t().heading }}</div>
            {{ t().body }}
            <button kbq-alert-control kbq-button [color]="'theme'" [kbqStyle]="'transparent'">
                {{ t().action }}
            </button>
            <button kbq-alert-control kbq-button [color]="'theme'" [kbqStyle]="'transparent'">
                {{ t().anotherAction }}
            </button>
        </kbq-alert>
    </div>
</div>
