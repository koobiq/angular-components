<button kbq-button (click)="openPanel()">{{ text().openPanel }}</button>

<ng-template #template>
    <kbq-sidepanel-header [closeable]="true">{{ text().panel }}</kbq-sidepanel-header>

    <kbq-sidepanel-body class="layout-padding-left-l">
        <kbq-accordion>
            <kbq-accordion-item>
                <button kbq-accordion-trigger type="button">{{ text().profile }}</button>
                <kbq-accordion-content>
                    {{ text().content }}
                </kbq-accordion-content>
            </kbq-accordion-item>
            <kbq-accordion-item>
                <button kbq-accordion-trigger type="button">{{ text().specifications }}</button>
                <kbq-accordion-content>
                    {{ text().content }}
                </kbq-accordion-content>
            </kbq-accordion-item>
            <kbq-accordion-item>
                <button kbq-accordion-trigger type="button">{{ text().servers }}</button>
                <kbq-accordion-content>
                    {{ text().content }}
                </kbq-accordion-content>
            </kbq-accordion-item>
            <kbq-accordion-item>
                <button kbq-accordion-trigger type="button">{{ text().data }}</button>
                <kbq-accordion-content>
                    {{ text().content }}
                </kbq-accordion-content>
            </kbq-accordion-item>
            <kbq-accordion-item>
                <button kbq-accordion-trigger type="button">{{ text().note }}</button>
                <kbq-accordion-content>
                    {{ text().content }}
                </kbq-accordion-content>
            </kbq-accordion-item>
        </kbq-accordion>
    </kbq-sidepanel-body>
</ng-template>
