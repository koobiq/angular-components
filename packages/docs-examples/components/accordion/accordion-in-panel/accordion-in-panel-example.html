<button kbq-button (click)="openPanel()">{{ t().openPanel }}</button>

<ng-template #template>
    <kbq-sidepanel-header [closeable]="true">{{ t().panel }}</kbq-sidepanel-header>

    <kbq-sidepanel-body class="layout-padding-left-l">
        <kbq-accordion>
            <kbq-accordion-item>
                <button kbq-accordion-trigger type="button">{{ t().profile }}</button>
                <kbq-accordion-content>
                    {{ t().content }}
                </kbq-accordion-content>
            </kbq-accordion-item>
            <kbq-accordion-item>
                <button kbq-accordion-trigger type="button">{{ t().specifications }}</button>
                <kbq-accordion-content>
                    {{ t().content }}
                </kbq-accordion-content>
            </kbq-accordion-item>
            <kbq-accordion-item>
                <button kbq-accordion-trigger type="button">{{ t().servers }}</button>
                <kbq-accordion-content>
                    {{ t().content }}
                </kbq-accordion-content>
            </kbq-accordion-item>
            <kbq-accordion-item>
                <button kbq-accordion-trigger type="button">{{ t().data }}</button>
                <kbq-accordion-content>
                    {{ t().content }}
                </kbq-accordion-content>
            </kbq-accordion-item>
            <kbq-accordion-item>
                <button kbq-accordion-trigger type="button">{{ t().note }}</button>
                <kbq-accordion-content>
                    {{ t().content }}
                </kbq-accordion-content>
            </kbq-accordion-item>
        </kbq-accordion>
    </kbq-sidepanel-body>
</ng-template>
