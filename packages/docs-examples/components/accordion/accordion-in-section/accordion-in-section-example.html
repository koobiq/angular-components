<div class="layout-column layout-fill layout-align-center-center layout-margin-top-xxl layout-margin-bottom-xxl">
    <kbq-accordion class="example-accordion-in-section layout-padding-s">
        <kbq-accordion-item>
            <button kbq-accordion-trigger type="button">{{ t().profile }}</button>
            <kbq-accordion-content>
                {{ t().content }}
            </kbq-accordion-content>
        </kbq-accordion-item>
        <kbq-accordion-item>
            <button kbq-accordion-trigger type="button">{{ t().specifications }}</button>
            <kbq-accordion-content>
                {{ t().content }}
            </kbq-accordion-content>
        </kbq-accordion-item>
        <kbq-accordion-item>
            <button kbq-accordion-trigger type="button">{{ t().servers }}</button>
            <kbq-accordion-content>
                {{ t().content }}
            </kbq-accordion-content>
        </kbq-accordion-item>
        <kbq-accordion-item>
            <button kbq-accordion-trigger type="button">{{ t().data }}</button>
            <kbq-accordion-content>
                {{ t().content }}
            </kbq-accordion-content>
        </kbq-accordion-item>
        <kbq-accordion-item>
            <button kbq-accordion-trigger type="button">{{ t().note }}</button>
            <kbq-accordion-content>
                {{ t().content }}
            </kbq-accordion-content>
        </kbq-accordion-item>
    </kbq-accordion>
</div>
