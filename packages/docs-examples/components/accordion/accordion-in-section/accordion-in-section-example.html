<div class="layout-column layout-fill layout-align-center-center layout-margin-top-xxl layout-margin-bottom-xxl">

        <kbq-accordion-item>
            <button kbq-accordion-trigger type="button">{{ text().profile }}</button>
            <kbq-accordion-content>
                {{ text().content }}
            </kbq-accordion-content>
        </kbq-accordion-item>
        <kbq-accordion-item>
            <button kbq-accordion-trigger type="button">{{ text().specifications }}</button>
            <kbq-accordion-content>
                {{ text().content }}
            </kbq-accordion-content>
        </kbq-accordion-item>
        <kbq-accordion-item>
            <button kbq-accordion-trigger type="button">{{ text().servers }}</button>
            <kbq-accordion-content>
                {{ text().content }}
            </kbq-accordion-content>
        </kbq-accordion-item>
        <kbq-accordion-item>
            <button kbq-accordion-trigger type="button">{{ text().data }}</button>
            <kbq-accordion-content>
                {{ text().content }}
            </kbq-accordion-content>
        </kbq-accordion-item>
        <kbq-accordion-item>
            <button kbq-accordion-trigger type="button">{{ text().note }}</button>
            <kbq-accordion-content>
                {{ text().content }}
            </kbq-accordion-content>
        </kbq-accordion-item>
    </kbq-accordion>
</div>
