<ng-template #action let-actionText="text" let-toast>
    <a kbqLink pseudo (click)="toast.close()">
        {{ actionText }}
    </a>
</ng-template>

<ng-template #toastActionInfo let-toast>
    <ng-container [ngTemplateOutlet]="action" [ngTemplateOutletContext]="{ $implicit: toast, text: text().refresh }" />
</ng-template>
<ng-template #toastActionWarning let-toast>
    <ng-container
        [ngTemplateOutlet]="action"
        [ngTemplateOutletContext]="{ $implicit: toast, text: text().changePassword }"
    />
</ng-template>

<ng-template #toastPermanentContentTemplate>
    @if (progress) {
        <kbq-progress-bar class="layout-margin-top-m layout-margin-bottom-m" [mode]="'indeterminate'" />
    } @else {
        <div>
            <span>{{ text().importComplete }}</span>
            <i kbq-icon="kbq-circle-check_16" class="kbq-success"></i>
        </div>
    }
</ng-template>

<ng-template #toastPermanentActionsTemplate let-toast>
    <a kbqLink pseudo (click)="toast.close()">{{ text().cancel }}</a>
</ng-template>

<div style="gap: 16px" class="layout-row">
    <button kbq-button (click)="showDefaultToast(toastActionInfo)">{{ text().byTimer }}</button>
    <button kbq-button (click)="showPermanentToast(toastPermanentContentTemplate, toastPermanentActionsTemplate)">
        По команде
    </button>
    <button kbq-button (click)="showWarningToast(toastActionWarning)">{{ text().hoverOrFocus }}</button>
</div>
