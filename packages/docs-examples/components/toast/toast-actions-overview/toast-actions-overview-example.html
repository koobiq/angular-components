<ng-template #toastSingleActonContentTemplate>
    {{ t().policy }}
    <span class="kbq-text-normal-strong">{{ t().mailServersWindows }}</span>
    {{ t().captionDeleted }}
</ng-template>

<ng-template #toastSingleActonActionsTemplate let-toast>
    <a kbqLink pseudo (click)="toast.close()">{{ t().restore }}</a>
</ng-template>

<ng-template #toastTwoActonActionsTemplate let-toast>
    <a kbqLink pseudo class="layout-margin-right-m" (click)="toast.close()">{{ t().view }}</a>
    <a kbqLink pseudo (click)="toast.close()">{{ t().reject }}</a>
</ng-template>

<ng-template #toastManyActionActionsTemplate let-toast>
    <a kbqLink pseudo class="layout-margin-right-m" (click)="toast.close()">Action 1</a>
    <a kbqLink pseudo class="layout-margin-right-m" (click)="toast.close()">Action 2</a>
    <a kbqLink pseudo role="button" [kbqDropdownTriggerFor]="dropdown">
        {{ t().more }}
        <i kbqLinkSuffix kbq-icon="kbq-chevron-down-s_16"></i>
    </a>
</ng-template>
<kbq-dropdown #dropdown="kbqDropdown">
    <button kbq-dropdown-item>Secondary action 1</button>
    <button kbq-dropdown-item>Secondary action 2</button>
    <button kbq-dropdown-item>Secondary action 3</button>
    <button kbq-dropdown-item>Secondary action 4</button>
</kbq-dropdown>

<div style="gap: 16px" class="layout-row">
    <button
        kbq-button
        (click)="showSingleActionToast(toastSingleActonContentTemplate, toastSingleActonActionsTemplate)"
    >
        {{ t().singleAction }}
    </button>
    <button kbq-button (click)="showTwoActionToast(toastTwoActonActionsTemplate)">{{ t().twoActions }}</button>
    <button kbq-button (click)="showManyActionToast(toastManyActionActionsTemplate)">{{ t().manyActions }}</button>
</div>
