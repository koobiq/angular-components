<ng-template #toastWithInlineLinkTemplate let-toast>
    <p>
        {{ t().request }}
        <a kbqLink pseudo>REQ-20180101-02</a>
        {{ t().assignedToYou }}
    </p>
</ng-template>

<ng-template #toastActionsTemplate let-toast>
    <a kbqLink pseudo (click)="toast.close()">{{ t().restore }}</a>
</ng-template>

<button kbq-button (click)="showToastWithInlineLink(toastWithInlineLinkTemplate, toastActionsTemplate)">
    {{ t().withInlineLink }}
</button>
