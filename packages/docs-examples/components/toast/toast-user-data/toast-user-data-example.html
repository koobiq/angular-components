<ng-template #toastAction let-toast>
    <a kbqLink pseudo (click)="toast.close()">
        {{ toast.data.userButtonName }}
    </a>
    <br />
    {{ toast.data.userData }}
</ng-template>

<div class="demo-block">
    <button kbq-button class="example-button" (click)="showToast(toastAction)">Show toast</button>
</div>
