<ng-template #action let-actionText="text" let-toast>
    <a kbqLink pseudo (click)="toast.close()">
        {{ actionText }}
    </a>
</ng-template>

<ng-template #toastActionInfo let-toast>
    <ng-container *ngTemplateOutlet="action; context: { $implicit: toast, text: 'Обновить' }" />
</ng-template>
<ng-template #toastActionWarning let-toast>
    <ng-container *ngTemplateOutlet="action; context: { $implicit: toast, text: 'Сменить пароль' }" />
</ng-template>
<ng-template #toastActionError let-toast>
    <ng-container *ngTemplateOutlet="action; context: { $implicit: toast, text: 'Повторить' }" />
</ng-template>

<div style="gap: 16px" class="layout-row">
    <button kbq-button type="button" (click)="showContrastToast(toastActionInfo)">Информация</button>
    <button kbq-button type="button" (click)="showSuccessToast()">Успех</button>
    <button kbq-button type="button" (click)="showWarningToast(toastActionWarning)">Предупреждение</button>
    <button kbq-button type="button" (click)="showErrorToast(toastActionError)">Ошибка</button>
</div>
