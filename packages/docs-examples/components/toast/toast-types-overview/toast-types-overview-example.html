<ng-template #action let-actionText="text" let-toast>
    <a kbqLink pseudo (click)="toast.close()">
        {{ actionText }}
    </a>
</ng-template>

<ng-template #toastActionInfo let-toast>
    <ng-container *ngTemplateOutlet="action; context: { $implicit: toast, text: text().refresh }" />
</ng-template>
<ng-template #toastActionWarning let-toast>
    <ng-container *ngTemplateOutlet="action; context: { $implicit: toast, text: text().changePassword }" />
</ng-template>
<ng-template #toastActionError let-toast>
    <ng-container *ngTemplateOutlet="action; context: { $implicit: toast, text: 'Повторить' }" />
</ng-template>

<div style="gap: 16px" class="layout-row">
    <button kbq-button (click)="showContrastToast(toastActionInfo)">{{ text().info }}</button>
    <button kbq-button (click)="showSuccessToast()">{{ text().success }}</button>
    <button kbq-button (click)="showWarningToast(toastActionWarning)">{{ text().warning }}</button>
    <button kbq-button (click)="showErrorToast(toastActionError)">{{ text().error }}</button>
</div>
