<ng-template #customContent>
    {{ t().paragraph }}
</ng-template>

<ng-template #customLargeContent>
    <p>
        {{ t().paragraph }}
    </p>
    <p>
        {{ t().secondParagraph }}
    </p>
</ng-template>

<div style="gap: 16px" class="layout-row layout-wrap layout-align-center">
    <button
        kbq-button
        kbqPopover
        [kbqPopoverHasCloseButton]="true"
        [kbqPopoverClass]="'popover-width-example'"
        [kbqPopoverContent]="customLargeContent"
        [kbqPopoverHeader]="'Medium'"
        [kbqPopoverSize]="selectedSize"
        (click)="selectedSize = popUpSizes.Medium"
    >
        Medium
    </button>
    <button
        kbq-button
        kbqPopover
        [kbqPopoverHasCloseButton]="true"
        [kbqPopoverClass]="'popover-width-example'"
        [kbqPopoverContent]="customLargeContent"
        [kbqPopoverHeader]="'Large'"
        [kbqPopoverSize]="selectedSize"
        (click)="selectedSize = popUpSizes.Large"
    >
        Large
    </button>
    <button
        kbq-button
        kbqPopover
        [kbqPopoverHasCloseButton]="true"
        [kbqPopoverClass]="'popover-width-custom-example'"
        [kbqPopoverContent]="customContent"
        [kbqPopoverHeader]="t().customWidth"
    >
        {{ t().customWidth }}
    </button>
</div>
