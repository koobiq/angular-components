<ng-template #customContent>
    <p style="margin-top: 0">
        {{ text().intro }}
    </p>
    <kbq-dl class="kbq-dl_wide">
        <kbq-dt>{{ text().dtYellow }}</kbq-dt>
        <kbq-dd>{{ text().ddSand }}</kbq-dd>

        <kbq-dt>{{ text().dtGreen }}</kbq-dt>
        <kbq-dd>{{ text().ddForest }}</kbq-dd>

        <kbq-dt>{{ text().dtMany }}</kbq-dt>
        <kbq-dd>{{ text().ddMany }}</kbq-dd>

        <kbq-dt>{{ text().dtFloor }}</kbq-dt>
        <kbq-dd>
            <kbq-badge [badgeColor]="badgeColors.FadeContrast">{{ text().ddBadge }}</kbq-badge>
        </kbq-dd>

        <kbq-dt>{{ text().dtStacked }}</kbq-dt>
        <kbq-dd>{{ text().ddAlive }}</kbq-dd>

        <kbq-dt>{{ text().dtAdults }}</kbq-dt>
        <kbq-dd>{{ text().ddDream }}</kbq-dd>
    </kbq-dl>
</ng-template>

<ng-template #customFooter>
    <button kbq-button (click)="kbqPopover.hide()">{{ text().close }}</button>
</ng-template>

<div style="gap: 16px" class="layout-row layout-wrap">
    <button
        kbq-button
        kbqPopover
        [kbqPopoverHasCloseButton]="true"
        [kbqPopoverContent]="customContent"
        [kbqPopoverHeader]="text().popoverTitle"
    >
        {{ text().onlyHeader }}
    </button>
    <button
        #kbqPopover="kbqPopover"
        kbq-button
        kbqPopover
        [kbqPopoverContent]="customContent"
        [kbqPopoverFooter]="customFooter"
    >
        {{ text().onlyFooter }}
    </button>
    <button kbq-button kbqPopover [kbqPopoverContent]="customContent">{{ text().plain }}</button>
</div>
