<ng-template #customContent>
    <p style="margin-top: 0">
        {{ t().intro }}
    </p>
    <kbq-dl class="kbq-dl_wide">
        <kbq-dt>{{ t().dtYellow }}</kbq-dt>
        <kbq-dd>{{ t().ddSand }}</kbq-dd>

        <kbq-dt>{{ t().dtGreen }}</kbq-dt>
        <kbq-dd>{{ t().ddForest }}</kbq-dd>

        <kbq-dt>{{ t().dtMany }}</kbq-dt>
        <kbq-dd>{{ t().ddMany }}</kbq-dd>

        <kbq-dt>{{ t().dtFloor }}</kbq-dt>
        <kbq-dd>
            <kbq-badge [badgeColor]="badgeColors.FadeContrast">{{ t().ddBadge }}</kbq-badge>
        </kbq-dd>

        <kbq-dt>{{ t().dtStacked }}</kbq-dt>
        <kbq-dd>{{ t().ddAlive }}</kbq-dd>

        <kbq-dt>{{ t().dtAdults }}</kbq-dt>
        <kbq-dd>{{ t().ddDream }}</kbq-dd>
    </kbq-dl>
</ng-template>

<ng-template #customFooter>
    <button kbq-button (click)="kbqPopover.hide()">{{ t().close }}</button>
</ng-template>

<div style="gap: 16px" class="layout-row layout-wrap">
    <button
        kbq-button
        kbqPopover
        [kbqPopoverHasCloseButton]="true"
        [kbqPopoverContent]="customContent"
        [kbqPopoverHeader]="t().popoverTitle"
    >
        {{ t().onlyHeader }}
    </button>
    <button
        #kbqPopover="kbqPopover"
        kbq-button
        kbqPopover
        [kbqPopoverContent]="customContent"
        [kbqPopoverFooter]="customFooter"
    >
        {{ t().onlyFooter }}
    </button>
    <button kbq-button kbqPopover [kbqPopoverContent]="customContent">{{ t().plain }}</button>
</div>
