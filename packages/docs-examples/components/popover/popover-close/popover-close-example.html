<ng-template #customContent>
    <h1 style="margin-top: 0" class="kbq-headline">{{ t().hybridRemote }}</h1>
    <p style="margin-top: 0">
        {{ t().videoConferencing }}
    </p>
    <p>
        {{ t().aroundInclusive }}
    </p>

    <p></p>
    <p>
        {{ t().privacy }}
    </p>

    <p></p>
    <p>
        {{ t().encryptedCalls }}
    </p>
    <p>
        {{ t().privacy }}
    </p>

    <p></p>
    <p style="margin-bottom: 0">
        {{ t().aroundInclusive }}
    </p>

    <p></p>
</ng-template>

<ng-template #shareContent>
    <div class="kbq-subheading">{{ t().shareProject }}</div>
    <div class="example-popover-close__text">
        {{ t().giveAccess }}
    </div>
    <form novalidate class="kbq-form-vertical">
        <div class="kbq-form__fieldset">
            <div class="kbq-form__label-wrapper">
                <label class="kbq-form__label">{{ t().email }}</label>
            </div>
            <div class="kbq-form__fieldset kbq-horizontal">
                <div class="kbq-form__row">
                    <kbq-form-field class="kbq-form__control">
                        <input kbqInput name="input" />
                    </kbq-form-field>
                </div>
                <div class="kbq-form__row">
                    <button kbq-button [color]="'contrast'" (click)="kbqSharePopover.hide(0)">
                        {{ t().sendInvite }}
                    </button>
                </div>
            </div>
        </div>
    </form>
    <div class="example-popover-close__list">
        <div class="example-popover-close__list-title">{{ t().members }}</div>
        @for (member of members(); track member) {
            <div class="example-popover-close__list-item">
                <div class="example-popover-close__list-item-left">
                    <img
                        alt="{{ member.name }}"
                        src="https://koobiq.io/assets/images/popover/list-member-{{ $index + 1 }}.png"
                        class="example-popover-close__list-item-image"
                    />
                    <div class="example-popover-close__list-item-name">{{ member.name }}</div>
                </div>
                <button
                    kbq-button
                    class="kbq-button_transparent"
                    [color]="componentColors.Contrast"
                    [kbqDropdownTriggerFor]="appDropdown"
                >
                    {{ member.role }}
                    <i kbq-icon="kbq-chevron-down-s_16" [color]="componentColors.Contrast"></i>
                </button>
            </div>
        }
        <kbq-dropdown #appDropdown="kbqDropdown" [class]="'max-width'" [navigationWithWrap]="true">
            <button kbq-dropdown-item>{{ t().editor }}</button>
            <button kbq-dropdown-item>{{ t().viewer }}</button>
        </kbq-dropdown>
    </div>
</ng-template>

<div style="gap: 16px" class="layout-row layout-wrap">
    <button
        #kbqSharePopover="kbqPopover"
        kbq-button
        kbqPopover
        [kbqPopoverHasCloseButton]="true"
        [kbqPopoverContent]="customContent"
    >
        {{ t().closeBigTitle }}
    </button>
    <button
        kbq-button
        kbqPopover
        [kbqPopoverHasCloseButton]="true"
        [kbqPopoverClass]="'example-popover-close'"
        [kbqPopoverContent]="shareContent"
    >
        {{ t().closeShare }}
    </button>
</div>
