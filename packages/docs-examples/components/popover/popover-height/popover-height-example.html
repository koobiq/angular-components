<ng-template #shortContent>
    <form novalidate class="kbq-form-vertical">
        <div class="kbq-form__fieldset">
            <div class="kbq-form__row">
                <label class="kbq-form__label">Relying Party Indicator</label>
                <kbq-form-field class="kbq-form__control">
                    <input kbqInput name="input" />
                </kbq-form-field>
            </div>
            <div class="kbq-form__row">
                <label class="kbq-form__label">Relying Party Indicator</label>
                <kbq-form-field class="kbq-form__control">
                    <input kbqInput name="input" />
                </kbq-form-field>
            </div>
            <div class="kbq-form__row">
                <label class="kbq-form__label">Post Back URL</label>
                <kbq-form-field class="kbq-form__control">
                    <input kbqInput name="input" />
                    <kbq-hint>{{ t().postBackHint }}</kbq-hint>
                </kbq-form-field>
            </div>
            <div class="kbq-form__row">
                <label class="kbq-form__label">Identity Provider Metadata</label>
                <kbq-form-field class="kbq-form__control">
                    <input kbqInput name="input" />
                    <kbq-hint>{{ t().metadataHint }}</kbq-hint>
                </kbq-form-field>
            </div>
        </div>
    </form>
</ng-template>

<ng-template #customContent>
    <form novalidate class="kbq-form-vertical">
        <div class="kbq-form__fieldset">
            <div class="kbq-form__row">
                <label class="kbq-form__label">Relying Party Indicator</label>
                <kbq-form-field class="kbq-form__control">
                    <input kbqInput name="input" />
                </kbq-form-field>
            </div>
            <div class="kbq-form__row">
                <label class="kbq-form__label">Relying Party Indicator</label>
                <kbq-form-field class="kbq-form__control">
                    <input kbqInput name="input" />
                </kbq-form-field>
            </div>
            <div class="kbq-form__row">
                <label class="kbq-form__label">Post Back URL</label>
                <kbq-form-field class="kbq-form__control">
                    <input kbqInput name="input" />
                    <kbq-hint>{{ t().postBackHint }}</kbq-hint>
                </kbq-form-field>
            </div>
            <div class="kbq-form__row">
                <label class="kbq-form__label">Group Attribute</label>
                <kbq-form-field class="kbq-form__control">
                    <input kbqInput name="input" />
                </kbq-form-field>
            </div>
            <div class="kbq-form__row">
                <label class="kbq-form__label">Identity Provider Metadata</label>
                <kbq-form-field class="kbq-form__control">
                    <input kbqInput name="input" />
                    <kbq-hint>{{ t().metadataHint }}</kbq-hint>
                </kbq-form-field>
            </div>
        </div>
    </form>
</ng-template>

<ng-template #customFooter>
    <div style="gap: 16px" class="layout-row layout-wrap">
        <button kbq-button [color]="'contrast'" (click)="activePopover.hide(0)">{{ t().save }}</button>
        <button kbq-button (click)="activePopover.hide(0)">{{ t().cancel }}</button>
    </div>
</ng-template>

<div style="gap: 16px" class="layout-row layout-wrap">
    <button
        #kbqNoScrollPopover="kbqPopover"
        kbq-button
        kbqPopover
        [kbqPopoverContent]="shortContent"
        [kbqPopoverFooter]="customFooter"
        [kbqPopoverHeader]="'SSO-connection'"
        (click)="activePopover = kbqNoScrollPopover"
    >
        {{ t().withoutScroll }}
    </button>
    <button
        #kbqAutoHeightPopover="kbqPopover"
        kbq-button
        kbqPopover
        [kbqPopoverContent]="customContent"
        [kbqPopoverFooter]="customFooter"
        [kbqPopoverHeader]="'SSO-connection'"
        (click)="activePopover = kbqAutoHeightPopover"
    >
        {{ t().defaultHeight }}
    </button>
    <button
        #kbqCustomHeightPopover="kbqPopover"
        kbq-button
        kbqPopover
        [kbqPopoverClass]="'popover-height-custom-example'"
        [kbqPopoverContent]="customContent"
        [kbqPopoverFooter]="customFooter"
        [kbqPopoverHeader]="'SSO-connection'"
        (click)="activePopover = kbqCustomHeightPopover"
    >
        {{ t().customHeight }}
    </button>
</div>
