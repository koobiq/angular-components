<ng-template #shareContent>
    <div class="kbq-subheading">{{ t().shareProject }}</div>
    <div class="popover-content-share-example__text">
        Give your teammates access to the project and start collaborating in real time
    </div>
    <form novalidate class="kbq-form-vertical">
        <div class="kbq-form__fieldset">
            <div class="kbq-form__label-wrapper">
                <label class="kbq-form__label">{{ t().email }}</label>
            </div>
            <div class="kbq-form__fieldset kbq-horizontal">
                <div class="kbq-form__row">
                    <kbq-form-field class="kbq-form__control">
                        <input kbqInput name="input" />
                    </kbq-form-field>
                </div>
                <div class="kbq-form__row">
                    <button kbq-button [color]="'contrast'" (click)="kbqSharePopover.hide(0)">
                        {{ t().sendInvite }}
                    </button>
                </div>
            </div>
        </div>
    </form>
    <div class="example-popover-content-share__list">
        <div class="example-popover-content-share__list-title">{{ t().members }}</div>
        @for (member of members(); track member) {
            <div class="example-popover-content-share__list-item">
                <div class="example-popover-content-share__list-item-left">
                    <img
                        alt="{{ member.name }}"
                        src="https://koobiq.io/assets/images/popover/list-member-{{ $index + 1 }}.png"
                        class="example-popover-content-share__list-item-image"
                    />
                    <div class="example-popover-content-share__list-item-name">{{ member.name }}</div>
                </div>
                <button
                    kbq-button
                    class="kbq-button_transparent"
                    [color]="componentColors.Contrast"
                    [kbqDropdownTriggerFor]="appDropdown"
                >
                    {{ member.role }}
                    <i kbq-icon="kbq-chevron-down-s_16" [color]="componentColors.Contrast"></i>
                </button>
            </div>
        }
        <kbq-dropdown #appDropdown="kbqDropdown" [class]="'max-width'" [navigationWithWrap]="true">
            <button kbq-dropdown-item>{{ t().editor }}</button>
            <button kbq-dropdown-item>{{ t().viewer }}</button>
        </kbq-dropdown>
    </div>
</ng-template>

<ng-template #customContent>
    <div
        class="example-popover-content-custom__image"
        [style]="{ 'background-image': 'url(\'/assets/images/popover/hero-header.jpg\')' }"
    ></div>
    <div class="example-popover-content-custom__container">
        <h4 class="kbq-title">{{ t().magicTitle }}</h4>
        <p>{{ t().magicText }}</p>
        <button kbq-button [color]="'contrast'" (click)="kbqCustomPopover.hide(0)">{{ t().doMagic }}</button>
    </div>
</ng-template>

<div style="gap: 16px" class="layout-row layout-wrap">
    <button
        #kbqSharePopover="kbqPopover"
        kbq-button
        kbqPopover
        [kbqPopoverHasCloseButton]="true"
        [kbqPopoverClass]="'example-popover-content-share'"
        [kbqPopoverContent]="shareContent"
    >
        {{ t().withoutHeaderPanel }}
    </button>
    <button
        #kbqCustomPopover="kbqPopover"
        kbq-button
        kbqPopover
        [kbqPopoverHasCloseButton]="true"
        [kbqPopoverClass]="'example-popover-content-custom'"
        [kbqPopoverContent]="customContent"
    >
        {{ t().customStyles }}
    </button>
</div>
