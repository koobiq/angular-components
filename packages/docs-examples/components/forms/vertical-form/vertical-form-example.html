<div class="kbq-text-big">
    <form novalidate class="kbq-form-vertical">
        <div class="kbq-form__fieldset">
            <div class="kbq-form__row">
                <label class="kbq-form__label">{{ t().fieldLabel }}</label>
                <kbq-form-field class="kbq-form__control">
                    <input kbqInput name="input" [(ngModel)]="value" />
                </kbq-form-field>
            </div>

            <div class="kbq-form__fieldset">
                <div style="display: flex" class="kbq-form__label-wrapper">
                    <label class="kbq-form__label">{{ t().commonLabel }}</label>
                </div>
                <div class="kbq-form__fieldset kbq-horizontal">
                    <div class="kbq-form__row flex-80">
                        <kbq-form-field class="kbq-form__control">
                            <input kbqInput name="input" [(ngModel)]="value" />

                            <kbq-hint>{{ t().hintUnderField }}</kbq-hint>
                        </kbq-form-field>
                    </div>
                    <div class="kbq-form__row flex-20">
                        <kbq-form-field class="kbq-form__control">
                            <input kbqInput name="input" [(ngModel)]="value" />
                        </kbq-form-field>
                    </div>
                </div>
            </div>

            <div class="kbq-form__row">
                <label class="kbq-form__label">{{ t().exfiltration }}</label>
                <kbq-form-field class="kbq-form__control">
                    <input kbqInput name="input" [(ngModel)]="value" />
                </kbq-form-field>
            </div>
        </div>

        <div class="kbq-form__fieldset">
            <div class="kbq-form__legend">{{ t().lateralMovement }}</div>
            <div class="kbq-form__row">
                <label class="kbq-form__label">{{ t().execution }}</label>
                <kbq-form-field class="kbq-form__control">
                    <input kbqInput name="input" [(ngModel)]="value" />
                </kbq-form-field>
            </div>

            <div class="kbq-form__row">
                <label class="kbq-form__label">
                    {{ t().longLabel }}
                </label>
                <kbq-form-field class="kbq-form__control flex-10">
                    <input kbqInput name="input" [(ngModel)]="value" />

                    <kbq-hint style="white-space: nowrap">{{ t().hintUnderField }}</kbq-hint>
                </kbq-form-field>
            </div>
        </div>
    </form>
</div>
