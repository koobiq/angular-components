<div class="kbq-text-big">
    <form novalidate class="kbq-form-horizontal">
        <div class="kbq-form__row">
            <label class="kbq-form__label flex-20">{{ text().fieldLabel }}</label>
            <kbq-form-field class="kbq-form__control flex-80">
                <input kbqInput name="input" [(ngModel)]="value" />

                <kbq-hint>{{ text().hintUnderField }}</kbq-hint>
            </kbq-form-field>
        </div>

        <div class="kbq-form__row">
            <label class="kbq-form__label flex-20">{{ text().commonLabel }}</label>
            <kbq-form-field class="kbq-form__control flex-50">
                <input kbqInput name="input" [(ngModel)]="value" />

                <kbq-hint>{{ text().hintUnderField }}</kbq-hint>
            </kbq-form-field>
            <kbq-form-field class="kbq-form__control flex-30">
                <input kbqInput name="input" [(ngModel)]="value" />

                <kbq-hint>{{ text().hintUnderField }}</kbq-hint>
            </kbq-form-field>
        </div>

        <div class="kbq-form__row">
            <label class="kbq-form__label flex-20">{{ text().exfiltration }}</label>
            <kbq-form-field class="kbq-form__control flex-80">
                <input kbqInput name="input" [(ngModel)]="value" />
            </kbq-form-field>
        </div>

        <div class="kbq-form__fieldset">
            <div class="kbq-form__legend">{{ text().lateralMovement }}</div>

            <div class="kbq-form__row">
                <label class="kbq-form__label flex-20">{{ text().execution }}</label>
                <kbq-form-field class="kbq-form__control flex-80">
                    <input kbqInput name="input" [(ngModel)]="value" />
                </kbq-form-field>
            </div>

            <div class="kbq-form__row">
                <label class="kbq-form__label flex-20">
                    {{ text().longLabel }}
                </label>
                <kbq-form-field class="kbq-form__control">
                    <input kbqInput name="input" [(ngModel)]="value" />

                    <kbq-hint style="white-space: nowrap">{{ text().hintUnderField }}</kbq-hint>
                </kbq-form-field>
            </div>
        </div>
    </form>
</div>
