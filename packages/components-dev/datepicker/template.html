<div class="dev-container">
    <label>Default datepicker toggle</label>
    <kbq-form-field
        #tooltip="kbqTooltip"
        kbqTooltipModifier="warning"
        [kbqTooltip]="'Только цифры'"
        (click)="myDatepicker1.toggle()"
    >
        <input
            [kbqDatepicker]="myDatepicker1"
            [kbqValidationTooltip]="tooltip"
            [max]="maxDate"
            [min]="minDate"
            [(ngModel)]="date"
            (dateChange)="onDateChange()"
            (dateInput)="onDateInput()"
        />
        <kbq-datepicker-toggle-icon kbqSuffix [for]="myDatepicker1" />
        <kbq-datepicker #myDatepicker1 [maxDate]="maxDate" [minDate]="minDate" [startAt]="startAt" />
    </kbq-form-field>

    <br />
    <br />

    <label>Datepicker toggle with custom icon</label>
    <kbq-form-field (click)="myDatepicker2.toggle()">
        <input [kbqDatepicker]="myDatepicker2" [(ngModel)]="date" />
        <i kbq-icon="kbq-calendar-o_16" kbqSuffix></i>
        <kbq-datepicker #myDatepicker2 />
    </kbq-form-field>

    <kbq-form-field>
        <i kbq-icon="kbq-clock_16" kbqPrefix></i>
        <input kbqTimepicker [(ngModel)]="date" />
    </kbq-form-field>
</div>
