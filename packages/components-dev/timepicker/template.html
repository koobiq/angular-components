<dev-locale-selector />

<dev-examples />

<div class="kbq-text-big">
    <kbq-radio-group class="layout-column" [(ngModel)]="timeFormat">
        <kbq-radio-button [value]="timeFormats.HHmm">{{ timeFormats.HHmm | lowercase }}</kbq-radio-button>
        <kbq-radio-button [value]="timeFormats.HHmmss">{{ timeFormats.HHmmss | lowercase }}</kbq-radio-button>
    </kbq-radio-group>

    <br />

    <div>value: {{ ngModelValue }}</div>
    <div>minDate: {{ minDate }}</div>
    <div>maxDate: {{ maxDate }}</div>

    <br />
    <br />

    <div>Validation state: {{ reactiveFormControlValue.errors | json }}</div>

    <kbq-form-field (click)="myDatepicker2.toggle()">
        <input [kbqDatepicker]="myDatepicker2" [max]="maxDate" [min]="minDate" [(ngModel)]="ngModelValue" />
        <i kbq-icon="kbq-calendar-o_16" kbqSuffix></i>
        <kbq-datepicker #myDatepicker2 />
    </kbq-form-field>

    <kbq-form-field>
        <i kbq-icon="kbq-clock_16" kbqPrefix></i>
        <input
            kbqTimepicker
            [format]="timeFormat"
            [max]="maxDate"
            [min]="minDate"
            [(ngModel)]="ngModelValue"
            (ngModelChange)="onTimepickerChange()"
        />
    </kbq-form-field>
</div>
