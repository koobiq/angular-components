<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <!-- The router needs a base href. The root element is `dev-all`, not the shared `dev-app`:
             27 sibling dev apps ship global `dev-app { … }` rules that would otherwise size the shell. -->
        <base href="/" />
        <meta content="width=device-width, initial-scale=1" name="viewport" />
        <meta content="yes" name="apple-mobile-web-app-capable" />
        <meta content="yes" name="mobile-web-app-capable" />
        <title>Dev All</title>
    </head>
    <body class="koobiq kbq-light">
        <dev-all></dev-all>
    </body>
</html>
