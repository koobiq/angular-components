<div class="dev-all-shell">
    <aside class="dev-all-sidebar">
        <dev-theme-toggle />
        <dev-locale-selector />

        <kbq-form-field>
            <i kbq-icon="kbq-magnifying-glass_16" kbqPrefix></i>
            <input kbqInput type="text" placeholder="Search component" [(ngModel)]="searchQuery" />
            <kbq-cleaner />
        </kbq-form-field>

        <nav class="dev-all-nav">
            @for (name of filteredAppNames(); track name) {
                <a
                    class="dev-all-nav__link"
                    routerLinkActive="dev-all-nav__link_active"
                    [routerLink]="['/', name]"
                    [innerHTML]="name | kbqHighlightBold: searchQuery()"
                ></a>
            } @empty {
                <div class="dev-all-nav__empty">Nothing found</div>
            }
        </nav>
    </aside>

    <!-- Overlays with reposition/close scroll strategies need the scroll container registered. -->
    <main class="dev-all-content" cdkScrollable>
        <router-outlet />
    </main>
</div>
