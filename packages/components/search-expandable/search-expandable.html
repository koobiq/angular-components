@if (!isOpened) {
    <button
        type="button"
        kbq-button
        class="kbq-search-expandable__button"
        [attr.aria-label]="tooltipText"
        [kbqTooltip]="tooltipText"
        [color]="'contrast'"
        [kbqStyle]="'transparent'"
        [kbqTooltipDisabled]="disabled"
        [tabIndex]="tabIndex"
        [disabled]="disabled"
        (click)="toggle()"
    >
        <i [kbq-icon]="searchIconName"></i>
    </button>
} @else {
    <kbq-form-field class="kbq-search-expandable__search">
        <i kbqPrefix [kbq-icon]="searchIconName"></i>

        <input
            kbqInput
            type="text"
            autocomplete="off"
            [attr.aria-label]="placeholder"
            [tabIndex]="tabIndex"
            [placeholder]="placeholder"
            [formControl]="control"
            [errorStateMatcher]="errorStateMatcher"
            (blur)="onTouch()"
            (keyup.escape)="toggle()"
            (keydown.enter)="onEnter($event)"
        />

        <button
            type="button"
            kbqSuffix
            kbq-icon-button="kbq-circle-xmark_16"
            [attr.aria-label]="a11yLocaleConfiguration().close"
            [disabled]="disabled"
            (click)="toggle()"
        ></button>
    </kbq-form-field>
}
