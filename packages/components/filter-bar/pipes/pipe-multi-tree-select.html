<kbq-tree-select
    #select
    [autoSelect]="false"
    [disabled]="data.disabled"
    [kbq-title]="pipeTooltip"
    [multiple]="true"
    [class]="{ 'kbq-active': select.panelOpen }"
    [ngModel]="selected"
    [panelClass]="`kbq-pipe-multi-tree-select__panel${isTemplateRef(valueTemplate) ? ' kbq-pipe-multi-tree-select__panel_custom-value' : ''}${multilineOptions ? ' kbq-pipe-multi-tree-select__panel_multiline' : ''}`"
    [panelMaxHeight]="panelMaxHeight"
    [searchMinOptionsThreshold]="noOptions ? 1 : undefined"
    [selectAllHandler]="selectAllHandler"
    [tabIndex]="-1"
    (closed)="onClose()"
    (opened)="onOpen()"
    (selectionChange)="onSelect($event)"
>
    <!-- Stays rendered without options, hidden by `searchMinOptionsThreshold`: the select wires its search up once. -->
    @if (data.search) {
        <kbq-form-field noBorders kbqSelectSearch>
            <i kbq-icon="kbq-magnifying-glass_16" kbqPrefix></i>
            <input
                placeholder="{{ localeConfiguration().search.placeholder }}"
                autocomplete="off"
                kbqInput
                type="text"
                [attr.aria-label]="localeConfiguration().search.placeholder"
                [formControl]="searchControl"
                (keydown.enter)="searchKeydownHandler()"
            />
            <kbq-cleaner />
        </kbq-form-field>
    }

    <div kbq-select-search-empty-result>{{ localeConfiguration().pipe.emptySearchResult }}</div>

    @if (noOptions) {
        <kbq-select-no-options>{{ noOptionsMessage }}</kbq-select-no-options>
    }

    <button
        kbq-button
        kbq-select-matcher
        [disabled]="data.disabled"
        [kbqPipeState]="data"
        [class]="{ 'kbq-active': select.panelOpen }"
    >
        <span #kbqTitleText class="kbq-pipe__name">{{ data.name }}</span>

        @if (select.selected?.length === 1) {
            <span #kbqTitleText class="kbq-pipe__value" [class.kbq-pipe__value_empty]="!select.triggerValue">
                {{ select.selected[0].name }}
            </span>
        } @else if (
            select.selected?.length > 1 &&
            (!selectedAllEqualsSelectedNothing || (selectedAllEqualsSelectedNothing && !allOptionsSelected))
        ) {
            <kbq-badge [badgeColor]="'contrast'" [compact]="true">
                {{ numberOfSelectedLeaves }}
            </kbq-badge>
        }
    </button>

    <kbq-tree-selection [dataSource]="dataSource" [treeControl]="treeControl">
        <kbq-tree-option
            *kbqTreeNodeDef="let node; when: isNodeSelectAll"
            kbqTreeNodePadding
            [class.kbq-selected]="allOptionsSelected"
            [selectable]="false"
            (click)="toggleSelectAllNode()"
        >
            <kbq-pseudo-checkbox [state]="selectAllCheckboxState" />
            <span [innerHTML]="treeControl.getViewValue(node) | kbqHighlightBackground: treeControl.filterQuery"></span>
        </kbq-tree-option>

        <kbq-tree-option
            *kbqTreeNodeDef="let node"
            kbqTreeNodePadding
            [checkboxThirdState]="true"
            [viewValue]="treeControl.getViewValue(node)"
        >
            <ng-container [ngTemplateOutlet]="nodeContent" [ngTemplateOutletContext]="{ $implicit: node }" />
        </kbq-tree-option>

        <kbq-tree-option
            *kbqTreeNodeDef="let node; when: hasChild"
            kbqTreeNodePadding
            [checkboxThirdState]="true"
            [viewValue]="treeControl.getViewValue(node)"
        >
            <kbq-tree-node-toggle [node]="node" />
            <ng-container [ngTemplateOutlet]="nodeContent" [ngTemplateOutletContext]="{ $implicit: node }" />
        </kbq-tree-option>
    </kbq-tree-selection>
</kbq-tree-select>

<ng-template #nodeContent let-node>
    @if (isTemplateRef(valueTemplate)) {
        <ng-container
            [ngTemplateOutlet]="$any(valueTemplate)"
            [ngTemplateOutletContext]="getValueTemplateContext(node)"
        />
    } @else {
        <div
            [class.kbq-truncate-line]="!multilineOptions"
            [innerHTML]="treeControl.getViewValue(node) | kbqHighlightBackground: treeControl.filterQuery"
        ></div>
        @if (node.caption) {
            <div
                class="kbq-option-caption"
                [class.kbq-truncate-line]="!multilineOptions"
                [innerHTML]="node.caption | kbqHighlightBackground: treeControl.filterQuery"
            ></div>
        }
    }
</ng-template>

@if (showRemoveButton) {
    <kbq-pipe-button />
}

<ng-template #pipeTooltip>
    <div class="kbq-pipe-tooltip__name kbq-text-compact">{{ data.name }}</div>
    <div class="kbq-pipe-tooltip__value kbq-text-compact">{{ select.triggerValue }}</div>
</ng-template>
