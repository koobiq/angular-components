<div class="kbq-inline-edit__focus_container">
    @if (label()) {
        <div class="kbq-inline-edit__label">
            <ng-content select="kbq-label" />
        </div>
    }

    <div #viewContainer class="kbq-inline-edit__view-container">
        <div
            #viewContent
            class="kbq-inline-edit__view-content"
            [attr.role]="viewContentRole()"
            [attr.tabindex]="tabIndex()"
            [attr.aria-label]="viewContentRole() ? accessibleName() : null"
            [attr.aria-expanded]="viewContentRole() ? isEditMode() : null"
            [attr.aria-disabled]="viewContentRole() && disabled() ? true : null"
        >
            <ng-content select="[kbqInlineEditViewMode]" />
        </div>

        @if (hasInteractiveContent() && mode() === 'view' && !disabled()) {
            <!-- `aria-expanded` is static: the anchor only exists in view mode, so it is never expanded. -->
            <div
                #focusAnchor
                class="kbq-inline-edit__focus-anchor cdk-visually-hidden"
                aria-expanded="false"
                role="button"
                tabindex="0"
                [attr.aria-label]="accessibleName()"
                (focus)="anchorFocused.set(true)"
                (blur)="anchorFocused.set(false)"
            ></div>
        }

        @if (menu() && mode() === 'view') {
            <div class="kbq-inline-edit__menu-mask">
                <div class="kbq-inline-edit__menu-mask-fade"></div>
                <div class="kbq-inline-edit__menu-mask-container">
                    <ng-content select="[kbqInlineEditMenu]" />
                </div>
            </div>
        }

        <ng-template
            cdkConnectedOverlay
            cdkConnectedOverlayLockPosition
            [cdkConnectedOverlayOpen]="isEditMode()"
            [cdkConnectedOverlayOrigin]="overlayOrigin()"
            [cdkConnectedOverlayOffsetY]="overlayOffsetY()"
            [cdkConnectedOverlayWidth]="overlayWidth()"
            [cdkConnectedOverlayDisableClose]="true"
            [cdkConnectedOverlayScrollStrategy]="scrollStrategy()"
            [cdkConnectedOverlayPanelClass]="overlayPanelClass()"
            [cdkConnectedOverlayHasBackdrop]="false"
            (attach)="onAttach()"
            (overlayOutsideClick)="onOverlayOutsideClick($event)"
            (overlayKeydown)="onOverlayKeydown($event)"
        >
            <div
                #panel
                class="kbq-inline-edit__panel"
                cdkTrapFocusAutoCapture
                [class.kbq-inline-edit__panel_select]="isSingleSelect()"
                [cdkTrapFocus]="false"
                (keydown.tab)="onPanelTab($event, panel, false)"
                (keydown.shift.tab)="onPanelTab($event, panel, true)"
            >
                <div
                    class="kbq-inline-edit__control-container"
                    [kbqTooltipColor]="colors.Error"
                    [kbqTooltip]="validationTooltip() ?? ''"
                    [kbqTooltipDisabled]="!validationTooltip()"
                    [kbqTooltipArrow]="false"
                    [kbqTrigger]="'manual'"
                    [kbqPlacement]="tooltipPlacement() ?? placements.TopLeft"
                    [kbqTooltipScrollStrategy]="validationTooltipScrollStrategy"
                >
                    <ng-content select="[kbqInlineEditEditMode]" />
                </div>

                @if (showActions()) {
                    <div class="kbq-inline-edit__action-buttons" role="group" [@panelAnimation]>
                        <div class="kbq-inline-edit__action-button">
                            <button
                                kbq-button
                                [attr.aria-label]="a11yLocaleConfiguration().save"
                                [color]="'contrast'"
                                (click)="save($event)"
                            >
                                <i kbq-icon="kbq-check_16"></i>
                            </button>
                        </div>

                        <div class="kbq-inline-edit__action-button">
                            <button
                                kbq-button
                                [attr.aria-label]="a11yLocaleConfiguration().cancel"
                                [color]="'contrast-fade'"
                                (click)="cancel()"
                            >
                                <i kbq-icon="kbq-xmark_16"></i>
                            </button>
                        </div>
                    </div>
                }
            </div>
        </ng-template>
    </div>
</div>
