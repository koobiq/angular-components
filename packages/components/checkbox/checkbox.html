<label class="kbq-checkbox__layout" [attr.for]="inputId()">
    <div
        class="kbq-checkbox__inner-container"
        [class.kbq-checkbox__inner-container_no-side-margin]="
            !checkboxLabel.textContent || !checkboxLabel.textContent.trim()
        "
    >
        <!--
            The wrapping label would fold the error and the hint into the accessible name, so the name is
            overridden with an explicit `aria-labelledby` pointing at the label text alone, and the error and
            the hint arrive as a description instead.
        -->
        <input
            #input
            type="checkbox"
            class="kbq-checkbox-input cdk-visually-hidden"
            [attr.aria-checked]="getAriaChecked()"
            [attr.aria-describedby]="ariaDescribedBy()"
            [attr.aria-invalid]="ariaInvalid()"
            [attr.aria-labelledby]="labelId()"
            [attr.name]="name()"
            [attr.value]="value()"
            [checked]="checked"
            [disabled]="disabled"
            [id]="inputId()"
            [indeterminate]="indeterminate"
            [required]="required()"
            [tabIndex]="tabIndex"
            (change)="onInteractionEvent($event)"
            (click)="onInputClick($event)"
        />
        <div class="kbq-checkbox__frame">
            <i class="kbq-checkbox-checkmark kbq kbq-check-s_16"></i>
            <i class="kbq-checkbox-mixedmark kbq kbq-minus-s_16"></i>
        </div>
    </div>

    <div class="kbq-checkbox__text-container">
        <span #checkboxLabel class="kbq-checkbox-label" [id]="labelId()" (cdkObserveContent)="onLabelTextChange()">
            <ng-content />
        </span>

        <!-- The error comes before the hint, as in a form field. -->
        @if (showError()) {
            <div class="kbq-checkbox__error" [id]="errorId()">
                <ng-content select="kbq-error" />
            </div>
        }

        <ng-content select="kbq-hint" />
    </div>
</label>
