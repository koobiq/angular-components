<label #label class="kbq-radio-label" [attr.for]="inputId">
    <!--
        The wrapping label would fold everything it contains — the projected hint included — into the
        accessible name, so the name is overridden with an explicit `aria-labelledby` pointing at the
        option text alone, and the hint arrives as a description instead.
    -->
    <input
        #input
        type="radio"
        class="kbq-radio-input cdk-visually-hidden"
        [attr.aria-describedby]="hint()?.id() ?? null"
        [attr.aria-labelledby]="labelId"
        [attr.name]="name"
        [attr.value]="nativeValue"
        [checked]="checked"
        [disabled]="disabled"
        [id]="inputId"
        [required]="required"
        [tabIndex]="tabIndex"
        (change)="onInputChange($event)"
        (click)="onInputClick($event)"
    />

    <div class="kbq-radio-label-content" [class.kbq-radio-label-before]="labelPosition === 'before'">
        <div class="kbq-radio-button__outer-circle">
            <div class="kbq-radio-button__inner-circle"></div>
        </div>

        <div class="kbq-radio__text-container">
            <span class="kbq-radio__text" [id]="labelId">
                <ng-content />
            </span>

            <ng-content select="kbq-hint" />
        </div>
    </div>
</label>
