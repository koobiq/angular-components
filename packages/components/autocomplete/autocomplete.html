<ng-template>
    <div class="kbq-autocomplete-panel" [id]="id" [class]="classList" [style.max-width.px]="panelMaxWidth()">
        <div #panel kbqScrollbarViewport class="kbq-autocomplete-panel__content">
            <!-- Keep the injected scrollbar outside the listbox's permitted option/group children. -->
            <div role="listbox" class="kbq-autocomplete-panel__listbox">
                <ng-content />
            </div>
        </div>
        <ng-content select="[kbqAutocompleteFooter], kbq-autocomplete-footer" />
    </div>
</ng-template>
