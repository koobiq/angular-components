<!-- A `<label>` with nothing to label is not exposed as one; the host's `aria-labelledby` names the group. -->
<span class="kbq-optgroup-label" [id]="labelId">
    <ng-content select="kbq-optgroup-label, [kbq-optgroup-label]" />
    @if (!hasProjectedLabel()) {
        {{ label() }}
    }
</span>
<ng-content select="kbq-option, kbq-list-option, kbq-timezone-option, ng-container" />
