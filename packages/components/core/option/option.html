@if (showCheckbox) {
    <ng-content select="kbq-pseudo-checkbox">
        <!-- Decorative: the selection state is announced through the host's `aria-selected`. -->
        <kbq-pseudo-checkbox aria-hidden="true" [disabled]="disabled" [state]="selected ? 'checked' : 'unchecked'" />
    </ng-content>
}

<span #kbqTitleText class="kbq-option-text">
    <ng-content />
</span>
