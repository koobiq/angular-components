<label class="kbq-toggle-layout" [attr.for]="inputId" [class.kbq-toggle-layout_left]="labelPosition() === 'left'">
    <input
        #input
        type="checkbox"
        class="kbq-toggle-input cdk-visually-hidden"
        [attr.aria-busy]="loading() ? 'true' : null"
        [attr.aria-checked]="getAriaChecked()"
        [attr.aria-describedby]="ariaDescribedBy"
        [attr.aria-disabled]="disabled || loading() ? 'true' : null"
        [attr.aria-invalid]="ariaInvalid()"
        [attr.aria-label]="ariaLabel() || null"
        [attr.aria-labelledby]="ariaLabelledby() || (ariaLabel() ? null : labelId)"
        [attr.name]="name()"
        [attr.role]="indeterminate ? null : 'switch'"
        [attr.value]="value()"
        [checked]="checked"
        [disabled]="disabled"
        [id]="inputId"
        [indeterminate]="indeterminate"
        [tabIndex]="tabIndex"
        (change)="onChangeEvent($event)"
        (click)="onInputClick($event)"
        (keydown.enter)="onEnterKeydown($event)"
    />
    <div class="kbq-toggle-bar-container">
        <div
            class="kbq-toggle-bar"
            [class.kbq-animations-disabled]="animationsDisabled"
            [class.kbq-progress]="loading()"
        >
            <div
                class="kbq-toggle__circle"
                [class]="`kbq-toggle__circle_${currentCheckState()}`"
                [class.kbq-animations-disabled]="animationsDisabled"
            ></div>
            <div class="kbq-toggle__thumb" [class.kbq-animations-disabled]="animationsDisabled"></div>
        </div>
    </div>

    <div
        class="kbq-toggle__content"
        [class.kbq-toggle__content_left]="labelPosition() === 'left'"
        [class.kbq-toggle__content_right]="labelPosition() === 'right'"
    >
        <span class="kbq-toggle-label" [id]="labelId">
            <ng-content />
        </span>

        <!--
            The error comes before the hint, as in a form field. The input is named by the label text alone, so the
            error stays out of its name and is announced as it appears.
        -->
        @if (showError()) {
            <div class="kbq-toggle__error" [id]="errorId">
                <ng-content select="kbq-error" />
            </div>
        }

        <!-- Hidden from the accessible name computation of the enclosing label; exposed as the input's description. -->
        <div class="kbq-toggle__hint" aria-hidden="true" [id]="hintId">
            <ng-content select="kbq-hint" />
        </div>
    </div>
</label>
