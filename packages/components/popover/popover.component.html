<!--
    The dialog role is dropped when nothing names the panel: a screen reader announces an unnamed dialog as
    just "dialog", and the `aria-dialog-name` audit fails it. A named panel keeps the role.
-->
<div
    #popover
    class="kbq-popover"
    [attr.role]="labelledByHeader || ariaLabel ? 'dialog' : null"
    [attr.aria-label]="labelledByHeader ? null : ariaLabel"
    [attr.aria-labelledby]="labelledByHeader ? headerId : null"
    [id]="panelId"
    [class.kbq-popover_arrowless]="!arrow"
    [cdkTrapFocus]="isTrapFocus"
    [class]="classMap"
    [@state]="visibility"
    (@state.done)="animationDone($event)"
    (@state.start)="animationStart()"
>
    <div
        class="kbq-popover__container"
        [class.kbq-popover__container_with-footer]="footer"
        [class.kbq-popover__container_with-header]="header"
    >
        @if (header) {
            <div
                class="kbq-popover__header"
                [class.kbq-popover__header_default-paddings]="defaultPaddings"
                [class.kbq-popover__header_with-close-button]="hasCloseButton"
                [kbqOverflowShadowTop]="overflowContainer()"
            >
                @if (isTemplateRef(header)) {
                    <ng-container [ngTemplateOutlet]="$any(header)" [ngTemplateOutletContext]="context" />
                } @else {
                    <div class="kbq-popover__header-text" [id]="headerId">{{ header }}</div>
                }
            </div>
        }

        @if (content) {
            <div
                #popoverContent="kbqOverflowShadowContainer"
                kbqOverflowShadowContainer
                kbqScrollbarViewport
                class="kbq-popover__content"
                [attr.tabindex]="isScrollableRegion(popoverContent) ? 0 : null"
                [attr.role]="isScrollableRegion(popoverContent) && labelledByHeader ? 'region' : null"
                [attr.aria-labelledby]="isScrollableRegion(popoverContent) && labelledByHeader ? headerId : null"
                [class.kbq-popover__content_default-paddings]="defaultPaddings"
                [debounce]="contentObserverDebounce"
                (cdkObserveContent)="popoverContent.checkOverflow()"
            >
                @if (isTemplateRef(content)) {
                    <ng-container [ngTemplateOutlet]="$any(content)" [ngTemplateOutletContext]="context" />
                } @else {
                    <div>{{ content }}</div>
                }
            </div>
        }

        @if (footer) {
            <div
                class="kbq-popover__footer"
                [class.kbq-popover__footer_default-paddings]="defaultPaddings"
                [kbqOverflowShadowBottom]="overflowContainer()"
            >
                @if (isTemplateRef(footer)) {
                    <ng-container [ngTemplateOutlet]="$any(footer)" [ngTemplateOutletContext]="context" />
                } @else {
                    <div>{{ footer }}</div>
                }
            </div>
        }
    </div>

    @if (hasCloseButton) {
        <div class="kbq-popover__close-container" [class.kbq-popover__close-container_without-header]="!header">
            <div class="kbq-popover__close" [class.kbq-popover__close_background-overlay-inverse]="!header">
                <button
                    kbq-button
                    class="kbq-button_transparent"
                    [attr.aria-label]="a11yLocaleConfiguration().close"
                    [color]="componentColors.Contrast"
                    (click)="onClose()"
                >
                    <i kbq-icon="kbq-xmark_16" [color]="componentColors.Contrast"></i>
                </button>
            </div>
        </div>
    }

    @if (arrow) {
        <div class="kbq-popover__arrow"></div>
    }
</div>
