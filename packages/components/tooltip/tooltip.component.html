<div
    #tooltip
    class="kbq-tooltip"
    role="tooltip"
    [attr.id]="id"
    [class.kbq-tooltip_arrowless]="!arrow"
    [class]="classMap"
    [@state]="visibility"
    (@state.done)="animationDone($event)"
    (@state.start)="animationStart()"
>
    <div class="kbq-tooltip__inner">
        @if (arrow) {
            <div class="kbq-tooltip__arrow" aria-hidden="true"></div>
        }

        @if (header) {
            <div class="kbq-tooltip__header">
                @if (isTemplateRef(header)) {
                    <ng-container [ngTemplateOutlet]="$any(header)" [ngTemplateOutletContext]="context" />
                } @else {
                    <div>{{ header }}</div>
                }
            </div>
        }
        <div class="kbq-tooltip__content">
            @if (isTemplateRef(content)) {
                <ng-container [ngTemplateOutlet]="$any(content)" [ngTemplateOutletContext]="context" />
            } @else {
                <div>{{ content }}</div>
            }
        </div>
    </div>
</div>
