version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    # A release is proposed only once it is a week old, so a compromised version is caught
    # before it reaches a pull request.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      # Dependabot has no biweekly interval: the 1st and 15th of the month approximate it.
      interval: 'cron'
      cronjob: '0 9 1,15 * *'
      timezone: 'Europe/Moscow'
    # Has to stay at least as long as npmMinimalAgeGate in .yarnrc.yml: Dependabot does not read
    # the gate when it picks a version, and yarn refuses to install a younger one. The same window
    # also holds back the transitive dependencies Dependabot resolves into the lockfile. Security
    # updates are not delayed. Our own packages are taken as soon as they are published.
    cooldown:
      default-days: 7
      exclude:
        - '@koobiq/*'
    ignore:
      # Majors are ignored only where the version is coupled to the Angular release train
      # and has to be upgraded deliberately, together with the framework. Everything else
      # gets major updates: a blanket ignore was the reason the tree drifted far enough to
      # accumulate advisories whose only fix lives in a newer major.
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@angular-devkit/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@schematics/angular'
        update-types: ['version-update:semver-major']
      - dependency-name: 'angular-eslint'
        update-types: ['version-update:semver-major']
      # Installed through a yarn `patch:` that ports angular/angular-cli@6d9b360e5, without which `ng build`
      # never exits. The patch is cut for one version, so @angular/build is bumped by hand together with the
      # rest of @angular/* and the patch re-cut for the new version; .claude/rules/deps.md has the steps and
      # the first release that ships the fix. Remove this entry together with the patch.
      - dependency-name: '@angular/build'
      # `@angular/build` 21 declares `vitest ^4` as its peer.
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      # vitest depends on `vite ^6 || ^7 || ^8`: a root vite beyond that range gives vitest a nested vite of
      # its own while @analogjs/vite-plugin-angular resolves the root one.
      - dependency-name: 'vite'
        update-types: ['version-update:semver-major']
      - dependency-name: 'ng-packagr'
        update-types: ['version-update:semver-major']
      - dependency-name: 'rxjs'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # AG Grid packages must stay on the same major and be upgraded together deliberately.
      - dependency-name: 'ag-grid-*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@koobiq/ag-grid-angular-theme'
        update-types: ['version-update:semver-major']
      # Ignores any major and minor updates, because @angular-devkit/architect@0.x.x has a non-standard angular semantic
      # version number
      - dependency-name: '@angular-devkit/architect'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # Ignores any major and minor updates, because @angular-devkit/architect-cli@0.x.x has a non-standard angular
      # semantic version number
      - dependency-name: '@angular-devkit/architect-cli'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # Majors can carry breaking token renames/removals that need a manual review, so only
      # minor and patch updates are automated.
      - dependency-name: '@koobiq/design-tokens'
        update-types: ['version-update:semver-major']
      # tools/tokens/docs builds the docs token data with its transforms, so a major is upgraded
      # by hand together with that generator.
      - dependency-name: '@koobiq/tokens-builder'
        update-types: ['version-update:semver-major']
    groups:
      # Security fixes arrive as a single pull request rather than one per advisory.
      security:
        applies-to: security-updates
        patterns:
          - '*'
      eslint:
        patterns:
          - 'eslint*'
          # `eslint*` does not match scoped names, so the scopes are listed separately. @eslint/js
          # provides `eslint.configs.recommended` and @eslint-community/* plugs into the same core:
          # both have to move in the same pull request as eslint itself, or the group lands a major
          # where the config and the linter come from different versions.
          - '@eslint/*'
          - '@eslint-community/*'
          - '@typescript-eslint/*'
          - '@angular-eslint/*'
          - '@stylistic/*'
      prettier:
        patterns:
          - 'prettier*'
      stylelint:
        patterns:
          - 'stylelint*'
      commitlint:
        patterns:
          - '@commitlint/*'
      cspell:
        patterns:
          - 'cspell'
          - '@cspell/*'
      angular:
        patterns:
          - '@angular/*'
          - 'rxjs'
          - '@angular-devkit/*'
          - '@schematics/angular'
          - 'ng-packagr'
          - 'tslib'
      ag-grid:
        patterns:
          - '@koobiq/ag-grid-angular-theme'
          - 'ag-grid-*'
      koobiq:
        patterns:
          - '@koobiq/*'
      docsearch:
        patterns:
          - '@docsearch/*'
      rollup:
        patterns:
          - 'rollup*'
          - '@rollup/*'
      conventional-changelog:
        patterns:
          - 'conventional-changelog*'
          - '@conventional-changelog/*'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - '@analogjs/*'
          - 'vite'
          - 'jsdom'
          - '@types/jsdom'
      # The MDX compiler of the documentation pages (tools/docs-pages). The remark plugins and the
      # mdast utilities are released together and share the `mdast` types, so a version that lands
      # alone leaves the compiler with two incompatible node models.
      unified:
        patterns:
          - 'unified'
          - 'remark-*'
          - 'mdast-util-*'
          - '@types/mdast'
      nunjucks:
        patterns:
          - 'nunjucks'
          - '@types/nunjucks'
      spdx-satisfies:
        patterns:
          - 'spdx-satisfies'
          - '@types/spdx-satisfies'
      merge2:
        patterns:
          - 'merge2'
          - '@types/merge2'
      inquirer:
        patterns:
          - 'inquirer'
          - '@inquirer/*'
      chalk:
        patterns:
          - 'chalk'
          - '@types/chalk'
      glob:
        patterns:
          - 'glob'
          - '@types/glob'
      luxon:
        patterns:
          - 'luxon'
          - '@types/luxon'
      express:
        patterns:
          - 'express'
          - '@types/express'

  # @koobiq/cli is published to npm with its own runtime dependencies, declared here rather
  # than in the root manifest. Without this entry those ranges are never updated and drift
  # away from the root devDependencies that mirror them.
  - package-ecosystem: 'npm'
    directory: '/packages/cli'
    schedule:
      interval: 'cron'
      cronjob: '0 9 1,15 * *'
      timezone: 'Europe/Moscow'
    # The same cooldown as the root entry, so these ranges move in step with the root
    # devDependencies that mirror them.
    cooldown:
      default-days: 7
      exclude:
        - '@koobiq/*'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(cli)'
