version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    ignore:
      # Majors are ignored only where the version is coupled to the Angular release train
      # and has to be upgraded deliberately, together with the framework. Everything else
      # gets major updates: a blanket ignore was the reason the tree drifted far enough to
      # accumulate advisories whose only fix lives in a newer major.
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@angular-builders/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@angular-devkit/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@schematics/angular'
        update-types: ['version-update:semver-major']
      - dependency-name: 'angular-eslint'
        update-types: ['version-update:semver-major']
      # ESLint is coupled to angular-eslint, and therefore to Angular: the template parser of
      # angular-eslint 20.x builds a ScopeManager without a global scope, which makes ESLint 10
      # crash on every template. ESLint 10 support lands in angular-eslint 21.4, which requires
      # Angular 21 — so the major has to wait for the framework upgrade.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      # Released in lockstep with eslint and consumed as `eslint.configs.recommended`, so it cannot
      # cross a major on its own — see the `eslint` entry above.
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      # Requires ESLint 10 since v4 — see the `eslint` entry above.
      - dependency-name: 'eslint-plugin-file-progress'
        update-types: ['version-update:semver-major']
      - dependency-name: 'jest-preset-angular'
        update-types: ['version-update:semver-major']
      - dependency-name: 'ng-packagr'
        update-types: ['version-update:semver-major']
      - dependency-name: 'rxjs'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'zone.js'
        update-types: ['version-update:semver-major']
      # Ignores any major and minor updates, because @angular-devkit/architect@0.x.x has a non-standard angular semantic
      # version number
      - dependency-name: '@angular-devkit/architect'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # Ignores any major and minor updates, because @angular-devkit/architect-cli@0.x.x has a non-standard angular
      # semantic version number
      - dependency-name: '@angular-devkit/architect-cli'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
    groups:
      # Security fixes arrive as a single pull request rather than one per advisory.
      security:
        applies-to: security-updates
        patterns:
          - '*'
      eslint:
        patterns:
          - 'eslint*'
          # `eslint*` does not match scoped names, so the scopes are listed separately. @eslint/js
          # provides `eslint.configs.recommended` and @eslint-community/* plugs into the same core:
          # both have to move in the same pull request as eslint itself, or the group lands a major
          # where the config and the linter come from different versions.
          - '@eslint/*'
          - '@eslint-community/*'
          - '@typescript-eslint/*'
          - '@angular-eslint/*'
          - '@stylistic/*'
      prettier:
        patterns:
          - 'prettier*'
      stylelint:
        patterns:
          - 'stylelint*'
      commitlint:
        patterns:
          - '@commitlint/*'
      cspell:
        patterns:
          - 'cspell'
          - '@cspell/*'
      angular:
        patterns:
          - '@angular/*'
          - 'rxjs'
          - 'zone.js'
          - '@angular-builders/*'
          - '@angular-devkit/*'
          - '@schematics/angular'
          - 'ng-packagr'
          - 'tslib'
      ag-grid:
        patterns:
          - '@koobiq/ag-grid-angular-theme'
          - 'ag-grid-*'
      koobiq:
        patterns:
          - '@koobiq/*'
      docsearch:
        patterns:
          - '@docsearch/*'
      rollup:
        patterns:
          - 'rollup*'
          - '@rollup/*'
      conventional-changelog:
        patterns:
          - 'conventional-changelog*'
          - '@conventional-changelog/*'
      jest:
        patterns:
          - 'jest*'
          - '@types/jest'
          - 'ts-jest'
      nunjucks:
        patterns:
          - 'nunjucks'
          - '@types/nunjucks'
      spdx-satisfies:
        patterns:
          - 'spdx-satisfies'
          - '@types/spdx-satisfies'
      merge2:
        patterns:
          - 'merge2'
          - '@types/merge2'
      inquirer:
        patterns:
          - 'inquirer'
          - '@inquirer/*'
      chalk:
        patterns:
          - 'chalk'
          - '@types/chalk'
      glob:
        patterns:
          - 'glob'
          - '@types/glob'
      luxon:
        patterns:
          - 'luxon'
          - '@types/luxon'
      express:
        patterns:
          - 'express'
          - '@types/express'

  # @koobiq/cli is published to npm with its own runtime dependencies, declared here rather
  # than in the root manifest. Without this entry those ranges are never updated and drift
  # away from the root devDependencies that mirror them.
  - package-ecosystem: 'npm'
    directory: '/packages/cli'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(cli)'
