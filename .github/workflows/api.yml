name: API

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/workflows/actions/setup-node
      - uses: ./.github/workflows/actions/build-packages
      # Before check-api: marking a declaration `@internal` always changes the golden files, and a failed step
      # would hide broken typings until the next run.
      - run: yarn run check-typings
      - run: yarn run check-api
      - run: yarn run check-public-api-any
      - run: yarn run docs:api-gen
      - run: yarn run check-api-docs
      # Reads the manifest docs:api-gen has just written, like check-api-docs.
      - run: yarn run check-llms
      # guides.json/history.json are committed and only regenerated at release time: this is the
      # gate that catches a guide or a guarded entry point added on a branch without rerunning
      # `build:mcp:data`. Needs no git history, just the checkout `build-packages` already has.
      - run: yarn run check-mcp-data
      # The MCP specs that read the built typings of @koobiq/components, or the assembled dist/mcp
      # over stdio, live here rather than in `units.yml`, which never builds either: without the
      # build they would have nothing to read. The rest of the MCP suite needs no build and runs as
      # part of `units.yml`'s `unit:all`.
      - run: yarn run unit:mcp:dts
