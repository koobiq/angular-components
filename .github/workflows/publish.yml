name: Publish

on:
  push:
    tags:
      - '*.*.*'
      # - '[0-9]+.[0-9]+.[0-9]+'
      # - '*@*.*.*' for NX integration

# Read-only default; the write scopes this workflow needs are granted on the job itself, so a
# future job added here does not silently inherit them.
permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    # `check-npm-resolution` gates this job on the npm registry answering; a stall must not hold the
    # release runner for the six-hour default.
    timeout-minutes: 60
    if: ${{ github.repository_owner == 'koobiq' }}
    permissions:
      contents: read # for actions/checkout to read the repository
      packages: write
      id-token: write # needed for provenance data generation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: ./.github/workflows/actions/setup-node

      - name: Build packages
        uses: ./.github/workflows/actions/build-packages

      - name: Check npm can resolve the packages
        run: yarn run check-npm-resolution

      - name: Publish package
        run: |
          rm -rf .npmrc && echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN_KOOBIQ" > ~/.npmrc
          npm run release:publish:ci-github -- -t latest
        env:
          NPM_TOKEN_KOOBIQ: ${{ secrets.NPM_PUBLISH_TOKEN }}
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MM_WEBHOOK_URL }}
          MATTERMOST_CHANNEL: ${{ secrets.MM_CHANNEL_NAME }}
          # Same untrusted webhook chain as pr-notify.yml. Deliberately not
          # NODE_TLS_REJECT_UNAUTHORIZED: that would also cover the `npm publish` in this step and
          # send NPM_TOKEN_KOOBIQ over an unverified connection. This flag reaches only the
          # notification request in packages/cli/src/release/notify-release.ts.
          MATTERMOST_ALLOW_UNTRUSTED_TLS: 'true'
