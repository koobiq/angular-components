name: E2E tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/workflows/actions/setup-node
      - id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      # The browser build is ~170 MB and was downloaded on every single run. It only changes
      # when Playwright does, so key the cache on the resolved version.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      # Capping the step means a stalled download fails fast instead of consuming the whole job
      # budget and taking the test run down with it — which is what happened in run 30790866073,
      # where the job hit the wall during setup and produced no report at all.
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: yarn run e2e:setup
        timeout-minutes: 8
      - id: run-e2e-tests
        run: |
          yarn run e2e:components
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        id: upload-report
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 5
      - uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        if: ${{ failure() && steps.run-e2e-tests.outcome == 'failure' }}
        with:
          message: |
            ### 🚨 E2E tests failed

            Review the [report](${{ steps.upload-report.outputs.artifact-url }}) for details.

            ---

            💡 Comment `/approve-snapshots` to approve snapshot changes.
