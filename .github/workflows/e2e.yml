name: E2E tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/workflows/actions/setup-node
      # Browser download plus apt normally takes a couple of minutes. Capping the step means a
      # stalled install fails fast instead of consuming the whole job budget and taking the test
      # run down with it — which is what happened in run 30790866073, where the job hit the 30
      # minute wall during setup and produced no report at all.
      - run: yarn run e2e:setup
        timeout-minutes: 60
      - id: run-e2e-tests
        run: |
          yarn run e2e:components
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        id: upload-report
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 5
      - uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        if: ${{ failure() && steps.run-e2e-tests.outcome == 'failure' }}
        with:
          message: |
            ### 🚨 E2E tests failed

            Review the [report](${{ steps.upload-report.outputs.artifact-url }}) for details.

            ---

            💡 Comment `/approve-snapshots` to approve snapshot changes.
