name: E2E tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/workflows/actions/setup-node
      # e2e:setup deliberately omits --with-deps: that shells out to sudo apt-get to install the
      # browser's system libraries, and the ubuntu-latest image already ships Chrome, Chromium,
      # Edge and Firefox, so they are present before the job starts. Please do not add it back
      # without checking the runner image first.
      #
      # Capping the step means a stalled download fails fast instead of consuming the whole job
      # budget and taking the test run down with it — which is what happened in run 30790866073,
      # where the job hit the wall during setup and produced no report at all. The cap only bites
      # while it stays below the job timeout.
      #
      # 8 minutes was too tight: the ~174 MB browser download alone has been overrunning it, so
      # the cap was killing otherwise-healthy runs. Keep this comfortably above the observed
      # duration — it is a guard against a hang, not a performance budget.
      - run: yarn run e2e:setup
        timeout-minutes: 20
      - id: run-e2e-tests
        run: |
          yarn run e2e:components
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        id: upload-report
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 5
      - uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        if: ${{ failure() && steps.run-e2e-tests.outcome == 'failure' }}
        with:
          message: |
            ### 🚨 E2E tests failed

            Review the [report](${{ steps.upload-report.outputs.artifact-url }}) for details.

            ---

            💡 Comment `/approve-snapshots` to approve snapshot changes.

  # Functional smoke for the documentation site. A separate job so it runs in parallel with the
  # component suite instead of sharing its time budget.
  #
  # TODO: `build`, `deploy-preview` and this job each rebuild the docs from scratch. Share the
  # `docs:build` output between the workflows as an artifact instead of rebuilding it three times.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # for actions/checkout to read the repository
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/workflows/actions/setup-node
      - uses: ./.github/workflows/actions/build-packages
      - uses: ./.github/workflows/actions/build-docs
      # Only Chromium: the docs smoke has a single project, unlike `e2e:setup`, which also pulls WebKit.
      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps
      - id: run-docs-tests
        run: yarn run e2e:docs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() && steps.run-docs-tests.outcome == 'failure' }}
        with:
          name: playwright-report-docs
          path: playwright-report-docs/
          retention-days: 5
