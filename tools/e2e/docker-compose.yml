# Runs the Playwright component suite in the image built from tools/e2e/Dockerfile.
#
# Invoke it through `yarn run e2e:docker` (tools/e2e/run.js), which supplies PLAYWRIGHT_VERSION
# from package.json and checks it is an exact version. Running `docker compose` against this file
# directly leaves that build argument empty, so the tag half of the image reference becomes
# `v-noble`; the pinned digest still resolves the correct image, but the tag no longer records
# which @playwright/test the browsers belong to, and nothing then verifies the two agree.

# Named explicitly because Compose otherwise derives the project name from this file's directory,
# which is just `e2e` — shared with every other repository that puts its compose file in tools/e2e,
# and enough for two projects to start reusing each other's containers and networks.
name: koobiq-e2e

services:
  e2e:
    # The committed baselines are x86-64. Pinning the platform stops an arm64 machine from quietly
    # producing renders that differ from CI in a way no diff explains; on Apple Silicon that means
    # emulation, which is slow but correct. Override only if you know why.
    platform: ${E2E_PLATFORM:-linux/amd64}
    build:
      context: ../..
      dockerfile: tools/e2e/Dockerfile
      args:
        - PLAYWRIGHT_VERSION
    # Reaps the Chromium processes that would otherwise pile up under PID 1.
    init: true
    # Recommended upstream for Chromium. Note that the usual justification — Docker's 64 MB
    # /dev/shm — does not apply here: Playwright passes --disable-dev-shm-usage unconditionally, so
    # Chromium uses /tmp regardless. Kept because upstream still recommends it and it costs nothing.
    ipc: host
    environment:
      # Read by playwright.config.ts. Not `yarn run dev:e2e`: Vite appends an inline source map to
      # every JavaScript response, so `ng serve` hands each fresh browser context 23–29 MB per page
      # load where the built bundle is 4 MB — see docs/e2e-performance.md. The image already holds
      # the production build (see the Dockerfile), so the server only serves dist/e2e as static
      # files. Host and port are left at their defaults, which are the same loopback literal
      # playwright.config.ts dials; binding by name instead would leave it to the resolver whether
      # the two ends meet on ::1 or 127.0.0.1 (tools/serve-static.mjs).
      WEB_SERVER_COMMAND: node tools/e2e/serve.mjs --skip-build
      # A percentage rather than a number, because a container reports every core on the host —
      # Playwright reads os.cpus(), which no cgroup or cpuset limit affects — and the right count scales
      # with it: on a 64-thread machine this is 32 workers, on a 16-thread one 8. Measured on 64
      # threads with the static server (docs/e2e-performance.md): the suite stops getting faster at 32
      # (66-72 s), while 48 and 64 only push the per-test latency up and bring back the contention
      # flakes the flakiness audit documents. CI overrides this to '100%', which on a 4-vCPU runner
      # is 4. Before the static server the cap was 8: `ng serve` handed every page load 29 MB, and 64
      # workers against it meant 255 failures and 802 timeouts.
      PLAYWRIGHT_WORKERS: ${PLAYWRIGHT_WORKERS:-50%}
      # Unset by default, which playwright.config.ts reads as 0: a flake fails the run rather than
      # being absorbed by a retry. Set it to a positive number to nurse a run through a known
      # flake; see docs/guides/06-testing.md.
      PLAYWRIGHT_RETRIES: ${PLAYWRIGHT_RETRIES:-}
    # Outputs only — the source tree comes from the image, deliberately, so a plain run cannot write
    # anywhere near the working tree. Writing updated baselines back is docker-compose.update.yml's
    # job instead.
    #
    # Mounted beside /app/test-results and /app/playwright-report rather than over them: Playwright
    # writes both on the image's own filesystem and tools/e2e/entrypoint.sh copies them here when the
    # run ends, which keeps a slow mount off the critical path and keeps the paths a failure prints
    # relative to where the files land. See docs/e2e-performance.md.
    volumes:
      - ../../playwright-report:/host/playwright-report
      - ../../test-results:/host/test-results
