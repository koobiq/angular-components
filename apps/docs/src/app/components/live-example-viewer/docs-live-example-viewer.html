<div class="docs-live-example__container">
    <div
        #exampleElement
        class="docs-live-example__example docs-live-example__example_{{ exampleId() }}"
        [attr.aria-busy]="isLoading() || null"
    >
        @if (exampleComponentType(); as exampleComponentType) {
            <ng-template [ngComponentOutlet]="exampleComponentType" />
        } @else if (isLoading()) {
            <kbq-skeleton class="docs-live-example__skeleton" />
        }
    </div>

    <div class="docs-live-example__footer kbq-text-big">
        <span
            kbq-link
            pseudo
            big
            role="button"
            tabindex="0"
            [attr.aria-expanded]="isSourceShown()"
            (click)="toggleSourceView()"
            (keydown.enter)="toggleSourceView()"
            (keydown.space)="$event.preventDefault(); toggleSourceView()"
        >
            {{ isSourceShown() ? t('hideExampleCode') : t('showExampleCode') }}
        </span>

        <div class="docs-live-example__footer-actions">
            <div class="docs-live-example__footer-icon-buttons">
                <button
                    kbq-button
                    color="theme"
                    kbqStyle="transparent"
                    kbqPlacement="bottom"
                    [kbqTooltip]="t('resetState')"
                    [attr.aria-label]="t('resetState')"
                    (click)="reload()"
                >
                    <i kbq-icon="kbq-arrow-rotate-left_16" aria-hidden="true"></i>
                </button>
                @if (fullscreenAvailable()) {
                    <button
                        kbq-button
                        color="theme"
                        kbqStyle="transparent"
                        kbqPlacement="bottom"
                        [kbqTooltip]="isFullscreen() ? t('exitFullscreen') : t('enterFullscreen')"
                        [attr.aria-label]="isFullscreen() ? t('exitFullscreen') : t('enterFullscreen')"
                        (click)="toggleFullscreen()"
                    >
                        <i
                            aria-hidden="true"
                            [kbq-icon]="
                                isFullscreen() ? 'kbq-arrows-collapse-diagonal_16' : 'kbq-arrows-expand-diagonal_16'
                            "
                        ></i>
                    </button>
                }
                <a
                    kbq-button
                    color="theme"
                    kbqStyle="transparent"
                    kbqPlacement="bottom"
                    target="_blank"
                    rel="nofollow"
                    [href]="examplePageUrl()"
                    [kbqTooltip]="t('openInNewTab')"
                    [attr.aria-label]="t('openInNewTab')"
                >
                    <i kbq-icon="kbq-arrow-up-right-from-square_16" aria-hidden="true"></i>
                </a>
            </div>
            <docs-stackblitz-button [exampleId]="example()" />
        </div>
    </div>
</div>

@if (isSourceShown() && files.length > 0) {
    <kbq-code-block [codeFiles]="files" [filled]="true" [lineNumbers]="true" />
}
