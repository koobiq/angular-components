<!-- Absent until the route resolves to a known item — and it never does for an unknown id, which
     only redirects to /404 on a later tick. Rendering the header unguarded threw in between. -->
@if (structureItem) {
    <div class="docs-component-header">
        <div docsRegisterHeader class="docs-component-name">
            {{ structureItem.name[locale()!] }}
        </div>
        <div class="docs-component-navbar layout-row layout-align-space-between-center layout-padding-top-s">
            @if (!structureItem.isGuide) {
                <nav kbqTabNavBar [tabNavPanel]="tabNavPanel">
                    <a
                        kbqTabLink
                        routerLinkActive="kbq-selected"
                        [routerLink]="structureItemTab.Overview"
                        (focus)="prefetchTab(structureItemTab.Overview)"
                        (mouseenter)="prefetchTab(structureItemTab.Overview)"
                    >
                        {{ t('overviewTab') }}
                    </a>
                    @if (structureItem.hasApi) {
                        <a
                            kbqTabLink
                            routerLinkActive="kbq-selected"
                            [routerLink]="structureItemTab.Api"
                            (focus)="prefetchTab(structureItemTab.Api)"
                            (mouseenter)="prefetchTab(structureItemTab.Api)"
                        >
                            {{ t('apiTab') }}
                        </a>
                    }
                    @if (structureItem.hasExamples) {
                        <a
                            kbqTabLink
                            routerLinkActive="kbq-selected"
                            [routerLink]="structureItemTab.Examples"
                            (focus)="prefetchTab(structureItemTab.Examples)"
                            (mouseenter)="prefetchTab(structureItemTab.Examples)"
                        >
                            {{ t('examplesTab') }}
                        </a>
                    }
                </nav>
            }

            <div class="docs-component-navbar__actions">
                @if (githubSourceUrl) {
                    <a kbq-link big target="_blank" rel="noopener noreferrer" [href]="githubSourceUrl">
                        <i kbq-icon="kbq-code_16"></i>
                        <span class="kbq-link__text">{{ t('viewSourceOnGitHub') }}</span>
                    </a>
                }

                <docs-copy-page [item]="structureItem" />
            </div>
        </div>
    </div>
}

<div #tabNavPanel="kbqTabNavPanel" kbqTabNavPanel>
    <router-outlet />
</div>
