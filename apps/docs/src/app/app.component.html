@let opened = opened$ | async;

@if (!isExamplePage()) {
    <docs-sidenav [class.docs-sidenav_closed]="!opened" [class.docs-sidenav_opened]="opened" />
}

<div class="docs-app-container layout-column flex">
    @if (!isExamplePage()) {
        <docs-navbar />

        <kbq-divider />
    }

    <router-outlet />

    @if (!isExamplePage()) {
        <div class="docs-overlay" [class.docs-overlay_visible]="opened"></div>
    }
</div>
